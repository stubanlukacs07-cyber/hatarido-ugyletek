async function importJSON(file) {
  let d;
  try { d = JSON.parse(await file.text()); } catch (e) { return toast('A fájl nem érvényes JSON mentés.', true); }
  if (!d || !Array.isArray(d.trades) || !Array.isArray(d.banks)) return toast('Ez nem ennek az alkalmazásnak a mentése.', true);
  const n = d.banks.length + d.trades.length + (d.deposits || []).length + (d.accounts || []).length;
  const isReplace = d.mode === 'replace';
  const summary = d.banks.length + ' bank, ' + d.trades.length + ' ügylet, ' + (d.deposits || []).length + ' lekötés és ' + (d.accounts || []).length + ' számla van a fájlban.' + (d.description ? ' ' + d.description : '');
  const choice = await askModal('Mentés visszatöltése', summary, '<p style="font-size:13.5px;color:var(--ink-2);margin:0 0 6px"><b>Csere:</b> csak a fájlban lévő tételek maradnak meg, minden más törlődik (a jelszótár és a beállítások megmaradnak). <b>Hozzáadás:</b> a fájl tételei bekerülnek vagy frissülnek, a többi megmarad.</p>', [['Mégse', false], ['Hozzáadás', 'merge', isReplace ? '' : 'primary'], ['Csere', 'replace', isReplace ? 'primary' : '']]);
  if (!choice) return;
  let done = 0, removed = 0;
  const all = [['banks', d.banks], ['trades', d.trades], ['deposits', d.deposits || []], ['accounts', d.accounts || []]];
  try {
    if (choice === 'replace') {
      for (const [k, arr] of all) {
        const keepIds = new Set(arr.filter(x => x && x.id).map(x => x.id));
        for (const it of S[k].slice()) if (!keepIds.has(it.id)) { await removeItem(k, it.id); removed++; if (removed % 25 === 0) toast('Törlés: ' + removed); }
      }
    }
    for (const [k, arr] of all) for (const it of arr) { if (it && it.id) { await saveItem(k, it); done++; if (done % 25 === 0) toast('Visszatöltés: ' + done + ' / ' + n); } }
    if (d.settings) await saveSettings(d.settings);
    if (d.market && d.market.rates && S.mode === 'online' && !S.local) await withRetry(() => DB.doc(BASE + '/market').set(clean(d.market)));
    if (d.vault && !S.vaultDoc && S.mode === 'online') await withRetry(() => DB.doc(BASE + '/vault').set(d.vault));
    toast('Kész: ' + done + ' tétel betöltve' + (removed ? ', ' + removed + ' törölve' : '') + '.');
    if (S.local) { Live.fetch(); }
  } catch (e) { toast('Hiba a visszatöltés közben (' + done + ' tétel kész): ' + ((e && e.message) || ''), true); }
}

function renderCalc(keepConv) {
  const el = $('#f-calc'); if (!el) return;
  const side = val('f-side'), pair = val('f-pair').trim().toUpperCase().replace(/\s+/g, ''), qty = parseNum(val('f-qty')), fwd = parseNum(val('f-fwd')), close = parseNum(val('f-crate'));
  const q = quoteCur(pair);
  const prevConv = keepConv ? val('f-conv') : '';
  const conv = q === 'HUF' ? 1 : (keepConv ? parseNum(prevConv) : toHUF(q));
  if (!side || !isNum(qty) || !isNum(fwd) || !q) { el.innerHTML = '<span class="mut">Eredmény számítása: add meg az irányt, a devizapárt, a mennyiséget és a határidős árat.</span>'; return; }
  const ri = rateInfo(pair);
  const cur = isNum(close) ? close : (ri ? ri.v : null);
  let s = '<b>Eredmény számítása</b><div class="cf">' + (side === 'eladas' ? '(határidős ár − záró árf.)' : '(záró árf. − határidős ár)') + ' × ' + nf2.format(qty) + ' 000 000' + (q !== 'HUF' ? ' × ' + q + '/HUF <input id="f-conv" inputmode="decimal" value="' + h(keepConv ? prevConv : numIn(conv ? Math.round(conv * 10000) / 10000 : '')) + '" aria-label="' + q + '/HUF árfolyam">' : '') + '</div>';
  if (isNum(cur) && isNum(conv)) {
    const diff = side === 'eladas' ? fwd - cur : cur - fwd;
    const res = Math.round(diff * qty * 1e6 * conv * 100) / 100;
    s += '<div class="cf"><span>' + (isNum(close) ? 'Záró árfolyammal' : 'A mostani piaci árfolyammal (' + fmtRate(Math.round(cur * 1e5) / 1e5) + ')') + ':</span><span class="res ' + signCls(res) + '">' + fmtFt(res, {sign: true, dec: true}) + '</span><button class="btn sm" type="button" data-calc-apply="' + res + '">Beírás az eredményhez</button></div>';
  } else s += '<span class="mut">Add meg a záró árfolyamot' + (q !== 'HUF' ? ' és a ' + q + '/HUF árfolyamot' : '') + '.</span>';
  el.innerHTML = s;
}

function genPassword() { const cs = 'ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz23456789!#%+-=?@'; const r = crypto.getRandomValues(new Uint32Array(18)); return Array.from(r, x => cs[x % cs.length]).join(''); }

  openDrawer('Árfolyamok frissítése', body, {
    saveLabel: 'Árfolyamok mentése',
    async onSave() {
      const now = new Date().toISOString(), src = val('r-src').trim() || 'kézi frissítés';
      const rates = Object.assign({}, S.market.rates || {}), snap = {};
      let changed = 0;
      $$('#drawer [data-pair]').forEach(inp => {
        const p = inp.dataset.pair, raw = inp.value.trim();
        if (!raw) { if (rates[p]) { delete rates[p]; changed++; } return; }

      const history = (S.market.history || []).concat([{t: now, r: snap}]).slice(-120);
      const doc = {rates, history, updatedAt: now, source: src};
      S.market = doc;
      if (S.mode === 'online') await withRetry(() => DB.doc(BASE + '/market').set(doc));
      scheduleRender(); toast('Árfolyamok mentve.');

/* ================= events ================= */
document.addEventListener('click', async e => {
  const t = e.target;
  if (!t.closest('#newMenu') && !t.closest('#newBtn')) closeMenu();
  const a = t.closest('a[href="#"]'); if (a) e.preventDefault();
  let el;
  if ((el = t.closest('[data-dr]'))) { const k = el.dataset.dr; if (k === 'close') closeDrawer(); else if (k === 'save') drSave(); else if (k === 'delete') drDelete(); return; }
  if (t.closest('#scrim')) { closeDrawer(); return; }
  if ((el = t.closest('[data-calc-apply]'))) { const inp = $('#f-pnl'); inp.value = numIn(+el.dataset.calcApply); inp.focus(); return; }
  if ((el = t.closest('[data-months-auto]'))) { $('#d-months').value = numIn(+el.dataset.monthsAuto); $('#d-months').dispatchEvent(new Event('input')); return; }
  if ((el = t.closest('[data-toggle-pw]'))) { const i = $('#v-pw'); i.type = i.type === 'password' ? 'text' : 'password'; return; }
  if ((el = t.closest('[data-gen-pw]'))) { const i = $('#v-pw'); i.value = genPassword(); i.type = 'text'; return; }
  if (t.closest('#drawer') || t.closest('#modal')) return;

  if ((el = t.closest('[data-go]'))) { const r = el.dataset.go; go(r); return; }
  if ((el = t.closest('[data-bank]'))) { if (UI.bankId !== el.dataset.bank) UI.tf = {status: 'all', pair: 'all', q: '', year: 'all', sort: 'open', dir: 'desc'}; go('bank', {bankId: el.dataset.bank, bankTab: UI.bankId === el.dataset.bank && UI.route === 'bank' ? UI.bankTab : 'trades'}); return; }
  if ((el = t.closest('[data-edit-trade]'))) { openTradeForm(el.dataset.editTrade); return; }
  if ((el = t.closest('[data-close-trade]'))) { const tr = S.trades.find(x => x.id === el.dataset.closeTrade); openTradeForm(el.dataset.closeTrade, {status: 'zart', closeDate: (tr && tr.closeDate) || TODAY()}); return; }
  if ((el = t.closest('[data-edit-dep]'))) { openDepositForm(el.dataset.editDep); return; }
  if ((el = t.closest('[data-edit-acc]'))) { openAccountForm(el.dataset.editAcc); return; }
  if ((el = t.closest('[data-btab]'))) { UI.bankTab = el.dataset.btab; render(); return; }
  if ((el = t.closest('[data-tf-status]'))) { UI.tf.status = el.dataset.tfStatus; $$('[data-tf-status]').forEach(b => b.setAttribute('aria-pressed', b === el)); renderTradeList(UI.bankId); return; }
  if ((el = t.closest('[data-sort]'))) { const k = el.dataset.sort; if (UI.tf.sort === k) UI.tf.dir = UI.tf.dir === 'asc' ? 'desc' : 'asc'; else { UI.tf.sort = k; UI.tf.dir = k === 'pair' ? 'asc' : 'desc'; } renderTradeList(UI.bankId); return; }
  if ((el = t.closest('[data-cmp-year]'))) { UI.cmpYear = el.dataset.cmpYear; render(); return; }
  if ((el = t.closest('[data-due-bank]'))) { UI.dueBank = el.dataset.dueBank; render(); return; }
  if ((el = t.closest('[data-eval-mode]'))) { UI.evalMode = el.dataset.evalMode; render(); return; }
  if ((el = t.closest('[data-eval-year]'))) { UI.evalYear = el.dataset.evalYear; UI.evalMonth = null; render(); return; }
  if ((el = t.closest('[data-eval-month]'))) { UI.evalMonth = el.dataset.evalMonth; UI.evalYear = UI.evalMonth.slice(0, 4); UI.evalMode = 'month'; go('eval'); return; }
  if ((el = t.closest('[data-basis]'))) { try { await saveSettings({dateBasis: el.dataset.basis}); } catch (err) { toast('A beállítás mentése nem sikerült.', true); } render(); return; }
  if ((el = t.closest('[data-resolve]'))) {
    const [kind, id] = el.dataset.resolve.split('|'); const it = S[kind].find(x => x.id === id); if (!it) return;
    const o = Object.assign({}, it, {flagsResolved: (it.flags || []).concat(it.flagsResolved || []), flags: []});
    try { await saveItem(kind, o); toast('Megjelölve ellenőrzöttként.'); } catch (err) { toast('Mentés sikertelen.', true); }
    return;
  }
  if ((el = t.closest('[data-v-reveal]'))) { vaultReveal(el.dataset.vReveal); return; }
  if ((el = t.closest('[data-v-copy]'))) { const en = V.entries.find(x => x.id === el.dataset.vCopy); if (en) copyText(en[el.dataset.field] || ''); return; }
  if ((el = t.closest('[data-v-edit]'))) { openVaultEntry(el.dataset.vEdit); return; }
  if ((el = t.closest('[data-v-del]'))) { const id = el.dataset.vDel; if (await confirmDel('Ez a jelszó')) { V.entries = V.entries.filter(x => x.id !== id); await persistVault(); render(); toast('Törölve.'); } return; }

  if ((el = t.closest('[data-act]'))) {
    const act = el.dataset.act, bid = el.dataset.bankid || (UI.route === 'bank' ? UI.bankId : null);
    closeMenu();
    try {
      switch (act) {
        case 'menu': toggleMenu(); break;
        case 'new-trade': openTradeForm(null, bid ? {bankId: bid} : null); break;
        case 'new-other': openTradeForm(null, Object.assign({kind: 'egyeb', status: 'zart', side: '', closeDate: TODAY()}, bid ? {bankId: bid} : {})); break;
        case 'new-deposit': openDepositForm(null, bid ? {bankId: bid} : null); break;
        case 'new-account': openAccountForm(null, bid ? {bankId: bid} : null); break;
        case 'new-bank': openBankForm(null); break;
        case 'edit-bank': openBankForm(bid); break;
        case 'edit-rates': if (S.local) Live.fetch(true); else openRatesForm(); break;
        case 'new-password': go('vault'); if (V.key) openVaultEntry(null); break;
        case 'eval-year': go('eval', {evalMode: 'year', evalYear: TODAY().slice(0, 4), evalMonth: null}); break;
        case 'eval-month': go('eval', {evalMode: 'month', evalYear: TODAY().slice(0, 4), evalMonth: TODAY().slice(0, 7)}); break;
        case 'vault-create': await vaultCreate(); break;
        case 'vault-unlock': await vaultUnlock(); break;
        case 'vault-lock': lockVault(); break;
        case 'vault-new': openVaultEntry(null); break;
        case 'vault-change': await changeMaster(); break;
        case 'export-json': exportJSON(); break;
        case 'sync-connect': { const b = el; b.disabled = true; b.textContent = 'Kapcsolódás…'; try { await Sync.connect(val('sy-repo'), val('sy-token'), val('sy-pass'), val('sy-dev')); SyncDraft.clear(); toast('A szinkron be van kapcsolva.'); } catch (err) { toast(err.message, true); } render(); break; }
        case 'sync-connect-code': { const b = el; b.disabled = true; b.textContent = 'Kapcsolódás…'; try { await Sync.connectWithCode(val('sy-code'), val('sy-pass-c'), val('sy-dev-c')); SyncDraft.clear(); toast('A szinkron be van kapcsolva.'); } catch (err) { toast(err.message, true); } render(); break; }
        case 'sync-code': { const code = await Sync.makeCode(); await askModal('Kapcsolókód', 'Másold át ezt a kódot a másik eszközre (pl. küldd el magadnak), és ott a szinkron jelszóval együtt add meg. A kód a szinkron jelszó nélkül használhatatlan.', '<textarea id="code-ta" readonly style="width:100%;height:110px;border:1px solid var(--line-2);border-radius:10px;padding:8px;font:12px ui-monospace,monospace;word-break:break-all">' + h(code) + '</textarea><button class="btn sm" style="margin-top:8px" onclick="(function(b){var t=document.getElementById(\'code-ta\');t.select();try{navigator.clipboard.writeText(t.value).then(function(){b.textContent=\'Kimásolva\'},function(){document.execCommand(\'copy\');b.textContent=\'Kimásolva\'})}catch(e){document.execCommand(\'copy\');b.textContent=\'Kimásolva\'}})(this)">Másolás</button>', [['Kész', true, 'primary']]); break; }
        case 'app-check': await Updater.check(true); render(); break;
        case 'app-update': Updater.apply(); break;
        case 'sync-now': await Sync.syncNow('manual'); toast(Sync.err ? Sync.err : 'Szinkronizálva.', !!Sync.err); break;
        case 'sync-rekey': try { await Sync.reKey(val('sy-pass2')); toast('Szinkronizálva.'); } catch (err) { toast(err.message, true); } render(); break;
        case 'sync-off': if (await askModal('Szinkron leválasztása', 'Ezen az eszközön kikapcsolom a szinkront. Az adatok itt és a GitHubon is megmaradnak.', '', [['Mégse', false], ['Leválasztás', true, 'primary']])) { await Sync.disconnect(); render(); } break;
        case 'export-csv': exportCSV(); break;
      }
    } catch (err) { console.error(err); toast((err && err.message) || 'Hiba történt.', true); }
  }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { if ($('#modal').classList.contains('on')) return; if ($('#drawer').classList.contains('on')) closeDrawer(); closeMenu(); }
  if (e.key === 'Enter') {
    const t = e.target;
    if (t.dataset && t.dataset.enter) { e.preventDefault(); const b = document.querySelector('[data-act="' + t.dataset.enter + '"]'); if (b) b.click(); return; }
    if (t.matches && t.matches('.dep[data-edit-dep]')) { openDepositForm(t.dataset.editDep); return; }
    if (t.closest && t.closest('#drawer') && t.tagName === 'INPUT') { e.preventDefault(); drSave(); }
  }
});
document.addEventListener('input', e => {
  const t = e.target;
  if (t.id === 'tf-q') { UI.tf.q = t.value; renderTradeList(UI.bankId); }
  else if (t.id === 'sy-repo') SyncDraft.set('repo', t.value);
  else if (t.id === 'sy-token') SyncDraft.set('token', t.value);
  else if (t.id === 'sy-dev' || t.id === 'sy-dev-c') SyncDraft.set('dev', t.value);
  else if (t.id === 'sy-code') SyncDraft.set('code', t.value);
  else if (t.id === 'sy-pass' || t.id === 'sy-pass-c') SyncDraft.pass = t.value;
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.id === 'tf-pair') { UI.tf.pair = t.value; renderTradeList(UI.bankId); }
  else if (t.id === 'tf-year') { UI.tf.year = t.value; renderTradeList(UI.bankId); }
  else if (t.id === 'tf-sort') { const p = t.value.split('|'); UI.tf.sort = p[0]; UI.tf.dir = p[1]; renderTradeList(UI.bankId); }
  else if (t.id === 'vx-file' && t.files[0]) { vaultImportXlsx(t.files[0]); t.value = ''; }
  else if (t.id === 'imp-file' && t.files[0]) { importJSON(t.files[0]); t.value = ''; }
});

/* ================= init ================= */
function init() {
  if (typeof Chart !== 'undefined') {
    Chart.defaults.font.family = '"IBM Plex Sans", ui-sans-serif, system-ui, sans-serif';
    Chart.defaults.font.size = 12;
  }
  try { window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => scheduleRender()); } catch (e) {}
  try { new MutationObserver(() => scheduleRender()).observe(document.documentElement, {attributes: true, attributeFilter: ['data-theme']}); } catch (e) {}
  let lastDay = TODAY();
  setInterval(() => { if (TODAY() !== lastDay) { lastDay = TODAY(); scheduleRender(); } }, 60000);
  render();
  initStore();
}
if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init); else init();
})();
</script>
<script>if ('serviceWorker' in navigator && location.protocol === 'https:') { window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () {}); }); }</script>

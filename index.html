<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Határidős ügyletek</title>
<meta name="theme-color" content="#1D1F5E">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Határidős">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>:root{
  --bg:#ECF0F8; --surface:#FFFFFF; --surface-2:#F4F6FB; --surface-3:#E7EBF4;
  --ink:#161E36; --ink-2:#34405E; --muted:#5E6A86; --line:#DBE1EC; --line-2:#C9D1E0;
  --side:#1D1F5E; --side-ink:#E9EBFF; --side-muted:#A6AADF; --side-hi:#2C2F7A;
  --brand:#6252F5; --brand-ink:#FFFFFF; --brand-soft:#ECEAFE;
  --profit:#0C9A6A; --profit-soft:#DDF6EC; --loss:#DC3F48; --loss-soft:#FDE6E7;
  --open:#B7790A; --open-strong:#F2B21C; --open-soft:#FFF3CF;
  --order:#0A86BF; --order-strong:#18B0EE; --order-soft:#DCF3FD;
  --tooltip-bg:#161E36;
  --shadow:0 1px 2px rgba(22,30,54,.05),0 10px 30px -18px rgba(22,30,54,.28);
  --r-xl:22px; --r-lg:16px; --r:12px; --r-sm:8px;
  --f-display:"Bricolage Grotesque",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-body:"IBM Plex Sans",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0D1324; --surface:#151D33; --surface-2:#1A233C; --surface-3:#222D4A;
    --ink:#E8ECF6; --ink-2:#C5CDE0; --muted:#95A0BC; --line:#28324E; --line-2:#344061;
    --side:#12143F; --side-ink:#E9EBFF; --side-muted:#9195CF; --side-hi:#23266A;
    --brand:#8A7EFF; --brand-ink:#0D1324; --brand-soft:#262455;
    --profit:#34D399; --profit-soft:rgba(52,211,153,.14); --loss:#F87171; --loss-soft:rgba(248,113,113,.14);
    --open:#FBBF24; --open-strong:#FBBF24; --open-soft:rgba(251,191,36,.14);
    --order:#38BDF8; --order-strong:#38BDF8; --order-soft:rgba(56,189,248,.14);
    --tooltip-bg:#2A3558;
    --shadow:0 1px 2px rgba(0,0,0,.25),0 12px 30px -18px rgba(0,0,0,.6);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0D1324; --surface:#151D33; --surface-2:#1A233C; --surface-3:#222D4A;
  --ink:#E8ECF6; --ink-2:#C5CDE0; --muted:#95A0BC; --line:#28324E; --line-2:#344061;
  --side:#12143F; --side-ink:#E9EBFF; --side-muted:#9195CF; --side-hi:#23266A;
  --brand:#8A7EFF; --brand-ink:#0D1324; --brand-soft:#262455;
  --profit:#34D399; --profit-soft:rgba(52,211,153,.14); --loss:#F87171; --loss-soft:rgba(248,113,113,.14);
  --open:#FBBF24; --open-strong:#FBBF24; --open-soft:rgba(251,191,36,.14);
  --order:#38BDF8; --order-strong:#38BDF8; --order-soft:rgba(56,189,248,.14);
  --tooltip-bg:#2A3558;
  --shadow:0 1px 2px rgba(0,0,0,.25),0 12px 30px -18px rgba(0,0,0,.6);
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font:15px/1.5 var(--f-body);-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
img,svg,canvas{max-width:100%}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2.5px solid var(--brand);outline-offset:2px;border-radius:6px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ---------- shell */
.shell{display:grid;grid-template-columns:248px minmax(0,1fr);min-height:100vh}
.side{background:var(--side);color:var(--side-ink);padding:22px 14px 18px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:18px;overflow-y:auto}
.logo{display:flex;align-items:center;gap:10px;padding:2px 8px 6px}
.logo-mark{width:34px;height:34px;border-radius:10px;background:conic-gradient(from 200deg,#2E9E3E 0 33%,#1560D4 0 66%,#D6283E 0);display:grid;place-items:center;flex:none}
.logo-mark span{width:14px;height:14px;border-radius:4px;background:var(--side)}
.logo b{font:700 17px/1.1 var(--f-display);letter-spacing:-.01em;display:block}
.logo small{color:var(--side-muted);font-size:12px}
.nav{display:flex;flex-direction:column;gap:2px}
.nav-sec{color:var(--side-muted);font-size:12px;padding:14px 10px 4px}
.nav a{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:10px;color:var(--side-ink);text-decoration:none;font-weight:500;font-size:14.5px}
.nav a:hover{background:var(--side-hi)}
.nav a[aria-current="page"]{background:#fff;color:var(--side)}
.nav a svg{width:18px;height:18px;flex:none;opacity:.9}
.nav .dot{width:10px;height:10px;border-radius:50%;flex:none;margin:0 4px;box-shadow:0 0 0 3px rgba(255,255,255,.12)}
.nav .count{margin-left:auto;background:var(--open-strong);color:#2A1C00;font-size:12px;font-weight:600;border-radius:999px;padding:0 7px;min-width:22px;text-align:center}
.nav a[aria-current="page"] .count{background:var(--side);color:#fff}
.side-foot{margin-top:auto;font-size:12px;color:var(--side-muted);padding:0 10px}

.main{min-width:0;padding:22px 30px 60px}
.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.top h1{font:800 clamp(24px,3vw,32px)/1.1 var(--f-display);letter-spacing:-.02em;margin:0;flex:1 1 auto;min-width:0}
.top h1 small{display:block;font:500 13.5px/1.4 var(--f-body);color:var(--muted);letter-spacing:0;margin-top:4px}
.top-actions{display:flex;gap:8px;flex-wrap:wrap;position:relative}

/* ---------- buttons, chips */
.btn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line-2);background:var(--surface);color:var(--ink);padding:8px 13px;border-radius:10px;font-weight:500;font-size:14px;line-height:1.2;white-space:nowrap}
.btn:hover{border-color:var(--ink-2)}
.btn svg{width:16px;height:16px;flex:none}
.btn.primary{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.ghost{background:transparent;border-color:transparent}
.btn.ghost:hover{background:var(--surface-3)}
.btn.danger{color:var(--loss);border-color:color-mix(in srgb,var(--loss) 40%,transparent)}
.btn.sm{padding:5px 9px;font-size:13px;border-radius:8px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.icon-btn{display:inline-grid;place-items:center;width:32px;height:32px;border-radius:8px;border:1px solid transparent;background:transparent;color:var(--muted)}
.icon-btn:hover{background:var(--surface-3);color:var(--ink)}
.icon-btn svg{width:17px;height:17px}
.seg{display:inline-flex;background:var(--surface-3);border-radius:11px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;padding:6px 12px;border-radius:8px;font-weight:500;font-size:13.5px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:2px 9px;font-size:12.5px;font-weight:600;white-space:nowrap;line-height:1.5}
.chip.st-open{background:var(--open-soft);color:var(--open)}
.chip.st-order{background:var(--order-soft);color:var(--order)}
.chip.st-closed{background:var(--surface-3);color:var(--muted)}
.chip.bank{color:#fff}
.chip.soft{background:var(--surface-3);color:var(--ink-2);font-weight:500}
.chip.flag{background:var(--open-soft);color:var(--open)}
.pill-btn{border:1px solid var(--line-2);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:13.5px;font-weight:500;color:var(--ink-2)}
.pill-btn[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--surface)}
.pos{color:var(--profit)} .neg{color:var(--loss)} .mut{color:var(--muted)}

/* ---------- panels */
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g-hero{grid-template-columns:minmax(0,5fr) minmax(0,7fr)}
.panel{background:var(--surface);border-radius:var(--r-lg);box-shadow:var(--shadow);padding:18px 20px;min-width:0}
.panel h2{font:700 17px/1.25 var(--f-display);margin:0 0 2px;letter-spacing:-.01em}
.panel .sub{color:var(--muted);font-size:13px;margin:0 0 12px}
.panel-head{display:flex;align-items:flex-start;gap:10px;margin-bottom:10px;flex-wrap:wrap}
.panel-head>div:first-child{flex:1 1 auto;min-width:0}
.panel-head .sub{margin:0}
.chart{position:relative;height:260px}
.chart.tall{height:320px}
.chart.short{height:210px}
.stack{display:flex;flex-direction:column;gap:16px}
.section-gap{margin-top:16px}

/* hero */
.hero{background:var(--surface);border-radius:var(--r-xl);box-shadow:var(--shadow);padding:22px 24px;display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:24px;align-items:stretch}
.hero-num{font:800 clamp(30px,3.3vw,52px)/1.05 var(--f-display);letter-spacing:-.03em;margin:6px 0 4px;white-space:nowrap}
@media (max-width:1100px){.hero-num{font-size:clamp(30px,7vw,52px)}}
.hero-lead{color:var(--muted);font-size:14px;margin:0}
.contrib{display:flex;height:14px;border-radius:999px;overflow:hidden;margin:18px 0 12px;background:var(--surface-3)}
.contrib i{display:block;height:100%}
.contrib-legend{display:grid;gap:8px}
.contrib-legend div{display:flex;align-items:center;gap:9px;font-size:14px}
.contrib-legend span.sw{width:11px;height:11px;border-radius:3px;flex:none}
.contrib-legend b{margin-left:auto;font-weight:600}
.hero-side{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:18px}
.mini{background:var(--surface-2);border-radius:12px;padding:10px 12px}
.mini .l{font-size:12.5px;color:var(--muted)}
.mini .v{font:700 18px/1.25 var(--f-display);letter-spacing:-.01em;margin-top:2px}

/* stat tiles */
.stat{background:var(--surface);border-radius:var(--r-lg);box-shadow:var(--shadow);padding:14px 16px;min-width:0}
.stat .l{font-size:13px;color:var(--muted)}
.stat .v{font:700 22px/1.2 var(--f-display);letter-spacing:-.015em;margin-top:4px;word-break:break-word}
.stat .s{font-size:12.5px;color:var(--muted);margin-top:2px}

/* bank tiles */
.bank-tile{position:relative;border-radius:var(--r-lg);padding:16px 18px 14px;color:#fff;background:var(--bc);box-shadow:var(--shadow);text-align:left;border:0;display:flex;flex-direction:column;gap:10px;min-width:0;overflow:hidden}
.bank-tile::after{content:"";position:absolute;right:-40px;top:-40px;width:150px;height:150px;border-radius:50%;background:rgba(255,255,255,.1)}
.bank-tile .bt-top{display:flex;align-items:center;gap:10px}
.mono{width:36px;height:36px;border-radius:11px;background:rgba(255,255,255,.2);display:grid;place-items:center;font:800 13px/1 var(--f-display);letter-spacing:.02em;flex:none}
.bank-tile .bt-name{font:700 17px/1.2 var(--f-display)}
.bank-tile .bt-num{font:800 26px/1.1 var(--f-display);letter-spacing:-.02em}
.bank-tile .bt-row{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;opacity:.92}
.bank-tile .bt-row b{font-weight:600}
.bank-tile:hover{filter:brightness(1.05)}
.bank-tile.add{background:var(--surface);color:var(--muted);border:2px dashed var(--line-2);box-shadow:none;align-items:center;justify-content:center;font-weight:600}
.bank-tile.add::after{display:none}
.bank-tile.add{flex-direction:row;min-height:120px}
.bank-tile.add svg{width:20px;height:20px;flex:none}
.bank-grid{grid-template-columns:repeat(auto-fit,minmax(230px,1fr))}

/* bank profile header */
.bank-head{border-radius:var(--r-xl);background:var(--bc);color:#fff;padding:22px 24px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:18px;position:relative;overflow:hidden;box-shadow:var(--shadow)}
.bank-head::before{content:"";position:absolute;right:-60px;bottom:-90px;width:280px;height:280px;border-radius:50%;background:rgba(255,255,255,.09)}
.bank-head .mono{width:52px;height:52px;border-radius:15px;font-size:16px}
.bank-head h2{font:800 30px/1.1 var(--f-display);margin:0;letter-spacing:-.02em}
.bank-head .bh-l{display:flex;gap:14px;align-items:center}
.bank-head .bh-sub{opacity:.85;font-size:14px}
.bank-head .bh-kpis{grid-column:1/-1;display:grid;grid-template-columns:minmax(0,1.7fr) repeat(5,minmax(0,1fr));gap:10px;position:relative}
.bank-head .k{background:rgba(255,255,255,.14);border-radius:12px;padding:10px 12px;min-width:0}
.bank-head .k .l{font-size:12.5px;opacity:.85}
.bank-head .k .v{font:700 19px/1.25 var(--f-display);margin-top:2px;word-break:break-word}
.bank-head .k.big .v{font-size:24px}
.bank-head .bh-actions{display:flex;gap:6px;align-items:flex-start;position:relative}
.bank-head .btn{background:rgba(255,255,255,.16);border-color:transparent;color:#fff}
.bank-head .btn:hover{background:rgba(255,255,255,.26)}

.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin:20px 0 14px;overflow-x:auto}
.tabs button{border:0;background:transparent;padding:10px 14px;font-weight:600;font-size:14.5px;color:var(--muted);border-bottom:2.5px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--bc,var(--brand))}
.tabs button .n{font-weight:500;color:var(--muted);margin-left:4px}

/* filters */
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.filters .spacer{flex:1}
.input,.select{border:1px solid var(--line-2);background:var(--surface);border-radius:10px;padding:8px 11px;font-size:14px;min-width:0}
.input:focus,.select:focus{outline:2px solid var(--brand);outline-offset:0;border-color:transparent}
.search{min-width:200px}

/* table */
.tbl-wrap{overflow-x:auto;background:var(--surface);border-radius:var(--r-lg);box-shadow:var(--shadow)}
table.tbl{width:100%;border-collapse:collapse;font-size:14px;min-width:980px}
.tbl th{position:sticky;top:0;background:var(--surface-2);color:var(--muted);font-weight:600;font-size:12.5px;text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap;user-select:none}
.tbl th.sortable{cursor:pointer}
.tbl th.sortable:hover{color:var(--ink)}
.tbl th.num,.tbl td.num{text-align:right}
.tbl td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top;white-space:nowrap}
.tbl tbody tr{cursor:pointer}
.tbl tbody tr:hover td{background:var(--surface-2)}
.tbl tr.r-open td:first-child{box-shadow:inset 4px 0 0 var(--open-strong)}
.tbl tr.r-order td:first-child{box-shadow:inset 4px 0 0 var(--order-strong)}
.tbl tr.r-open td{background:color-mix(in srgb,var(--open-soft) 55%,transparent)}
.tbl tr.r-order td{background:color-mix(in srgb,var(--order-soft) 55%,transparent)}
.tbl .two{display:flex;flex-direction:column;line-height:1.3}
.tbl .two small{color:var(--muted);font-size:12.5px}
.tbl td.pnl{font-weight:600}
.tbl tfoot td{font-weight:700;background:var(--surface-2);border-bottom:0}
.tbl.compact{min-width:0}
.tbl.compact td,.tbl.compact th{padding:8px 10px}
.flag-ic{color:var(--open);display:inline-flex;vertical-align:-3px}
.flag-ic svg{width:15px;height:15px}
.empty{padding:34px 20px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--ink);font:700 17px/1.3 var(--f-display);margin-bottom:4px}

/* due list */
.due-group{margin-bottom:18px}
.due-group h3{font:700 16px/1.3 var(--f-display);margin:0 0 8px;display:flex;align-items:center;gap:8px}
.due-group h3 .sum{margin-left:auto;font:600 14px var(--f-body)}
.due-item{display:grid;grid-template-columns:76px minmax(0,1fr) auto;gap:14px;align-items:center;background:var(--surface);border-radius:14px;box-shadow:var(--shadow);padding:12px 16px;margin-bottom:8px;border-left:5px solid var(--bc)}
.due-date{text-align:center;line-height:1.1}
.due-date b{display:block;font:800 24px/1 var(--f-display)}
.due-date small{color:var(--muted);font-size:12px}
.due-main{min-width:0}
.due-main .t{font-weight:600}
.due-main .d{color:var(--muted);font-size:13.5px}
.due-right{text-align:right;display:flex;flex-direction:column;gap:6px;align-items:flex-end}
.due-right .a{font:700 17px/1.2 var(--f-display)}
.due-days{font-size:12.5px;font-weight:600;border-radius:999px;padding:1px 8px;background:var(--surface-3);color:var(--ink-2)}
.due-days.late{background:var(--loss-soft);color:var(--loss)}
.due-days.soon{background:var(--open-soft);color:var(--open)}
details.more{margin-top:6px;font-size:13px;color:var(--muted)}
details.more summary{cursor:pointer;color:var(--ink-2)}
details.more ul{margin:6px 0 0;padding-left:18px}

/* kv lists */
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;font-size:14px}
.kv dt{color:var(--muted)}
.kv dd{margin:0;text-align:right;font-weight:600}
.note-box{background:var(--surface-2);border-radius:12px;padding:12px 14px;font-size:13.5px;color:var(--ink-2);white-space:pre-wrap}
.flag-box{background:var(--open-soft);color:var(--ink);border-radius:12px;padding:10px 14px;font-size:13.5px}
.flag-box ul{margin:4px 0 0;padding-left:18px}
.flag-box b{color:var(--open)}

/* deposit cards */
.dep{background:var(--surface);border-radius:var(--r-lg);box-shadow:var(--shadow);padding:16px 18px;display:flex;flex-direction:column;gap:10px;border-top:4px solid var(--bc);cursor:pointer;min-width:0}
.dep:hover{box-shadow:0 0 0 2px var(--line-2),var(--shadow)}
.dep .dh{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.dep .dh b{font:700 16px/1.2 var(--f-display)}
.dep .dv{font:800 22px/1.1 var(--f-display);letter-spacing:-.01em}
.progress{height:8px;border-radius:999px;background:var(--surface-3);overflow:hidden}
.progress i{display:block;height:100%;background:var(--bc)}
.dep .row{display:flex;justify-content:space-between;gap:10px;font-size:13.5px;flex-wrap:wrap}
.dep .row span{color:var(--muted)}

/* vault */
.vault-lock{max-width:440px;margin:30px auto;text-align:center}
.vault-lock .ic{width:64px;height:64px;border-radius:20px;margin:0 auto 14px;display:grid;place-items:center;background:var(--brand-soft);color:var(--brand)}
.vault-lock .ic svg{width:30px;height:30px}
.vault-lock h2{font:800 24px/1.2 var(--f-display);margin:0 0 6px}
.vault-lock p{color:var(--muted);margin:0 0 16px}
.vault-lock form{display:flex;flex-direction:column;gap:10px;text-align:left}
.v-entry{background:var(--surface);border-radius:var(--r-lg);box-shadow:var(--shadow);padding:14px 16px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 12px}
.v-entry .vt{font:700 16px/1.25 var(--f-display);display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.v-line{display:flex;align-items:center;gap:6px;min-width:0;font-size:14px}
.v-line .lab{color:var(--muted);width:92px;flex:none;font-size:13px}
.v-line code{font:500 14px/1.4 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;background:var(--surface-2);border-radius:7px;padding:3px 8px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.v-line code.masked{letter-spacing:.15em;color:var(--muted)}

/* forms (drawer) */
.scrim{position:fixed;inset:0;background:rgba(10,14,30,.45);z-index:40;display:none}
.scrim.on{display:block}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(560px,100%);background:var(--surface);z-index:50;box-shadow:-20px 0 50px -20px rgba(0,0,0,.35);transform:translateX(105%);transition:transform .22s ease;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.drawer.on{transform:none}
.dr-head{display:flex;align-items:center;gap:10px;padding:16px 20px;border-bottom:1px solid var(--line)}
.dr-head h3{font:700 19px/1.2 var(--f-display);margin:0;flex:1}
.dr-body{padding:16px 20px;overflow-y:auto;flex:1}
.dr-foot{display:flex;gap:8px;padding:12px 20px;border-top:1px solid var(--line);flex-wrap:wrap}
.dr-foot .spacer{flex:1}
.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 14px}
.form .full{grid-column:1/-1}
.fld{display:flex;flex-direction:column;gap:4px;min-width:0}
.fld label{font-size:13px;font-weight:600;color:var(--ink-2)}
.fld .hint{font-size:12px;color:var(--muted)}
.fld input,.fld select,.fld textarea{border:1px solid var(--line-2);background:var(--surface);border-radius:10px;padding:9px 11px;font-size:14.5px;width:100%}
.fld textarea{min-height:76px;resize:vertical}
.fld input:focus,.fld select:focus,.fld textarea:focus{outline:2px solid var(--brand);outline-offset:0;border-color:transparent}
.fld.err input{border-color:var(--loss)}
.check{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:500}
.check input{width:18px;height:18px;accent-color:var(--brand)}
.form[data-kind="egyeb"] .t-only{display:none}
.calc{background:var(--brand-soft);border-radius:12px;padding:12px 14px;font-size:13.5px;display:flex;flex-direction:column;gap:8px}
.calc .cf{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.calc .cf input{width:120px;border:1px solid var(--line-2);border-radius:8px;padding:6px 9px;background:var(--surface)}
.calc .res{font-weight:700}
.swatches{display:flex;gap:8px;flex-wrap:wrap}
.swatches button{width:30px;height:30px;border-radius:9px;border:2px solid transparent}
.swatches button[aria-pressed="true"]{border-color:var(--ink);box-shadow:0 0 0 2px var(--surface) inset}

/* menu, modal, toast */
.menu{position:absolute;right:0;top:calc(100% + 6px);background:var(--surface);border-radius:14px;box-shadow:0 20px 50px -20px rgba(0,0,0,.4),0 0 0 1px var(--line);padding:6px;z-index:30;min-width:220px;display:none}
.menu.on{display:block}
.menu button{display:flex;width:100%;align-items:center;gap:10px;border:0;background:transparent;padding:9px 10px;border-radius:9px;text-align:left;font-size:14px}
.menu button:hover{background:var(--surface-2)}
.menu button svg{width:17px;height:17px;color:var(--muted)}
.modal{position:fixed;inset:0;z-index:60;display:none;place-items:center;padding:20px;background:rgba(10,14,30,.45)}
.modal.on{display:grid}
.modal .box{background:var(--surface);border-radius:18px;padding:20px 22px;max-width:420px;width:100%;box-shadow:0 30px 60px -20px rgba(0,0,0,.5)}
.modal .box h3{font:700 18px/1.3 var(--f-display);margin:0 0 6px}
.modal .box p{color:var(--ink-2);margin:0 0 16px;font-size:14.5px}
.modal .box .acts{display:flex;justify-content:flex-end;gap:8px}
.toasts{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:70;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.toast{background:var(--tooltip-bg);color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;box-shadow:0 10px 30px -10px rgba(0,0,0,.5)}
.toast.bad{background:var(--loss)}
.banner{border-radius:12px;padding:10px 14px;margin-bottom:14px;font-size:14px;background:var(--order-soft);color:var(--ink)}
.banner.warn{background:var(--open-soft)}
.loading{padding:60px 20px;text-align:center;color:var(--muted)}
.spin{width:28px;height:28px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--brand);margin:0 auto 12px;animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.legend-note{font-size:12.5px;color:var(--muted);margin-top:8px}
.link{color:var(--brand);background:none;border:0;padding:0;font-weight:600;text-decoration:underline;text-underline-offset:2px}

/* mobile tab bar */
.tabbar{display:none}
@media (max-width:1100px){
  .g4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .bank-head .bh-kpis{grid-template-columns:repeat(3,minmax(0,1fr))}
  .hero{grid-template-columns:1fr}
}
@media (max-width:860px){
  .shell{grid-template-columns:1fr}
  .side{display:none}
  .main{padding:16px 14px calc(84px + env(safe-area-inset-bottom,0px))}
  .g2,.g3,.g-hero{grid-template-columns:1fr}
  .top-actions .hide-m{display:none}
  .tabbar{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:35;background:var(--side);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));justify-content:space-around;gap:2px}
  .tabbar a{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--side-muted);text-decoration:none;font-size:11px;font-weight:600;padding:6px 2px;border-radius:10px;position:relative}
  .tabbar a svg{width:21px;height:21px}
  .tabbar a[aria-current="page"]{color:#fff;background:var(--side-hi)}
  .tabbar .count{position:absolute;top:2px;right:calc(50% - 20px);background:var(--open-strong);color:#2A1C00;font-size:10px;border-radius:999px;padding:0 5px}
  .bank-head{padding:18px}
  .bank-head .bh-kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .hero-side{grid-template-columns:1fr 1fr}
  .due-item{grid-template-columns:58px minmax(0,1fr);}
  .due-right{grid-column:1/-1;flex-direction:row;justify-content:space-between;align-items:center}
  .form{grid-template-columns:1fr}
  .search{min-width:0;flex:1 1 160px}
}
@media (max-width:520px){ .g4{grid-template-columns:1fr 1fr} .stat .v{font-size:19px} }
@media print{ .side,.tabbar,.top-actions,.btn,.icon-btn{display:none!important} .main{padding:0} .panel,.stat,.hero{box-shadow:none;border:1px solid #ddd} }

/* ticker */
.ticker{display:flex;gap:6px;overflow-x:auto;margin:-4px 0 16px;padding:2px 0 4px;scrollbar-width:thin}
.ticker[hidden]{display:none}
.tk,.tk-upd{flex:none;display:inline-flex;align-items:baseline;gap:7px;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:6px 11px;font-size:13px;white-space:nowrap}
.tk:hover,.tk-upd:hover{border-color:var(--line-2)}
.tk-p{color:var(--muted);font-weight:600}

.tk-c{font-size:12px;font-weight:600;color:var(--muted)}
.tk-c.up{color:var(--profit)} .tk-c.down{color:var(--loss)}
.tk-upd{align-items:center;color:var(--brand);font-weight:600;background:var(--brand-soft);border-color:transparent}
.tk-upd svg{width:15px;height:15px}
/* market tiles */
.q-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.quote{background:var(--surface);border-radius:var(--r-lg);box-shadow:var(--shadow);padding:14px 16px 10px;display:flex;flex-direction:column;gap:4px;min-width:0;position:relative}
.quote .qp{display:flex;align-items:center;justify-content:space-between;gap:6px;font-weight:700;font-size:14px}
.quote .qv{font:800 26px/1.1 var(--f-display);letter-spacing:-.02em}
.quote .qc{font-size:13px;font-weight:600}
.quote .qm{font-size:12px;color:var(--muted)}
.quote .qx{font-size:12.5px;color:var(--ink-2);border-top:1px solid var(--line);padding-top:6px;margin-top:4px}
.quote canvas{height:38px!important;width:100%!important}
.spark{height:38px;position:relative}
.rate-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 14px}
.rate-grid .fld small{color:var(--muted);font-size:12px}
.pos-bar{display:inline-block;height:6px;border-radius:3px;vertical-align:middle;margin-left:6px}
@media (max-width:860px){ .rate-grid{grid-template-columns:1fr 1fr} }

.hero h2{font:700 17px/1.25 var(--f-display);margin:0 0 2px;letter-spacing:-.01em}
.hero .sub{color:var(--muted);font-size:13px;margin:0 0 10px}

/* ===== trade cards, More hub, responsive tables ===== */
.only-m{display:none}
.hero-side.two{grid-template-columns:repeat(2,minmax(0,1fr))}
.mini .v small{display:block;font:500 12.5px/1.3 var(--f-body);color:var(--muted);margin-top:2px}
.tcards{display:flex;flex-direction:column;gap:8px}
.tcard{display:block;width:100%;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:11px 12px 10px;box-shadow:var(--shadow);border-left:4px solid var(--line-2)}
.tcard.r-open{border-left-color:var(--open-strong);background:color-mix(in srgb,var(--open-soft) 45%,var(--surface))}
.tcard.r-order{border-left-color:var(--order-strong);background:color-mix(in srgb,var(--order-soft) 45%,var(--surface))}
.tc-top{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.tc-t{font-weight:700;font-size:15px}
.tc-q{font-size:13px}
.tc-pnl{margin-left:auto;font:700 15.5px/1.2 var(--f-display);white-space:nowrap}
.tc-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;margin-top:8px}
.tc-grid div{display:flex;flex-direction:column;min-width:0;font-size:12.5px;line-height:1.3}
.tc-grid small{color:var(--muted);font-size:11.5px}
.tc-grid span{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tc-grid em{font-style:normal;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tc-note{font-size:12.5px;color:var(--muted);margin-top:6px}
.list-sum{display:flex;justify-content:space-between;align-items:center;background:var(--surface);border-radius:12px;padding:10px 12px;margin-bottom:8px;font-size:14px;box-shadow:var(--shadow)}
.more-sec{margin-bottom:18px}
.more-sec h3{font:700 15px/1.3 var(--f-display);color:var(--muted);margin:0 0 8px 4px}
.more-sec{background:transparent}
.more-row{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--surface);border:0;border-bottom:1px solid var(--line);padding:12px 14px;min-height:56px}
.more-sec h3+.more-row{border-radius:14px 14px 0 0}
.more-row:last-child{border-radius:0 0 14px 14px;border-bottom:0}
.more-sec h3+.more-row:last-child{border-radius:14px}
.more-row:hover{background:var(--surface-2)}
.mr-ic{width:36px;height:36px;border-radius:10px;background:var(--brand-soft);color:var(--brand);display:grid;place-items:center;flex:none}
.mr-ic svg{width:19px;height:19px}
.mr-t{flex:1;min-width:0;display:flex;flex-direction:column}
.mr-t b{font-weight:600;font-size:15px}
.mr-t small{color:var(--muted);font-size:12.5px}
.mr-ch{color:var(--muted);font-size:22px;line-height:1}

@media (max-width:700px){
  body{font-size:15px}
  .only-m{display:inline-block}
  .hide-m{display:none!important}
  .main{padding:12px 12px calc(86px + env(safe-area-inset-bottom,0px))}
  .top{margin-bottom:12px;gap:8px}
  .top h1{font-size:25px}
  .ticker{margin:0 -12px 12px;padding:0 12px 4px}
  .hero,.panel{padding:16px 14px;border-radius:18px}
  .hero{grid-template-columns:1fr!important;gap:16px}
  .hero-num{font-size:clamp(28px,8.6vw,44px);white-space:normal}
  .hero-side,.hero-side.two{grid-template-columns:1fr;gap:6px;margin-top:14px}
  .mini{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 12px;width:100%}
  .mini .v{font-size:16px;text-align:right}

  .mini .l{flex:1;min-width:0}
  .grid{gap:12px}
  .g4,.stats-m{grid-template-columns:repeat(2,minmax(0,1fr))}
  .stat{padding:12px}
  .stat .v{font-size:18px}
  .chart{height:220px}
  .chart.tall{height:250px}
  .chart.short{height:190px}
  .panel h2{font-size:16px}
  .bank-grid{grid-template-columns:1fr}
  .bank-tile{padding:14px 16px}
  .bank-tile .bt-num{font-size:24px}
  .bank-head{grid-template-columns:1fr;padding:16px;border-radius:18px;gap:14px}
  .bank-head h2{font-size:24px}
  .bank-head .bh-actions{order:3}
  .bank-head .bh-kpis{grid-template-columns:repeat(2,minmax(0,1fr));order:2}
  .bank-head .k.big{grid-column:1/-1}
  .bank-head .k.big .v{font-size:24px}
  .bank-head .k .v{font-size:16px}
  .tabs{margin:14px -12px 12px;padding:0 12px}
  .tabs button{padding:10px 12px}
  .filters{gap:8px}
  .filters .spacer{display:none}
  .filters>.seg{width:100%}
  .filters .seg button{flex:1;padding:8px 6px;font-size:13px}
  .filters .select,.filters .input{flex:1 1 45%;min-width:0;font-size:16px;padding:9px 10px}
  .filters .search{flex:1 1 100%}
  .filters>.btn{flex:1 1 45%;justify-content:center;padding:10px}
  .filters .chips{width:100%;flex-wrap:nowrap;overflow-x:auto;padding-bottom:2px}
  .filters>div:not(.seg):not(.chips){width:100%}
  .pill-btn{padding:7px 13px;flex:none}
  .btn{min-height:40px}
  .btn.sm{min-height:34px}
  .icon-btn{width:40px;height:40px}
  .seg{display:flex}
  .seg button{flex:1}
  .kv{font-size:14px}
  .legend-note{font-size:12px}
  .due-item{padding:12px;gap:10px;grid-template-columns:52px minmax(0,1fr)}
  .due-date b{font-size:21px}
  .due-group h3{flex-wrap:wrap}
  .due-group h3 .sum{margin-left:0;width:100%;font-size:13.5px}
  .q-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
  .quote{padding:11px 12px 8px}
  .quote .qv{font-size:21px}
  .quote .qm{display:none}
  .quote .qx{font-size:12px}
  .spark{height:30px}
  .dep{padding:14px}
  .v-entry{padding:12px 14px}
  .v-line .lab{width:74px}
  .fld input,.fld select,.fld textarea{font-size:16px}
  .dr-head{padding:12px 14px}
  .dr-body{padding:14px}
  .dr-foot{padding:10px 14px}
  .dr-foot .btn{flex:1;justify-content:center}
  .dr-foot .spacer{display:none}
  .drawer{width:100%}
  .calc .cf input{width:110px;font-size:16px}
  .menu{position:fixed;left:12px;right:12px;top:auto;bottom:calc(76px + env(safe-area-inset-bottom,0px));min-width:0}
  .menu button{padding:13px 12px;font-size:15px}
  .vault-lock{margin:10px auto}
  /* responsive tables become cards */
  .rwrap{overflow:visible}
  .tbl-wrap.rwrap{background:transparent;box-shadow:none;overflow:visible}
  table.resp,table.resp tbody,table.resp tfoot,table.resp tr,table.resp td{display:block;width:100%}

  table.resp tr.r-open td,table.resp tr.r-order td{background:transparent!important;box-shadow:none!important}
  table.resp td{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:4px 0!important;border:0!important;white-space:normal!important;text-align:right!important;max-width:none!important;background:transparent!important}
  table.resp td::before{content:attr(data-l);color:var(--muted);font-size:12.5px;font-weight:500;text-align:left;flex:none;max-width:48%}
  table.resp td[data-l=""]::before{display:none}
  table.resp td.rh{justify-content:flex-start;text-align:left!important;font-weight:600;gap:6px}
  table.resp td.rh::before{display:none}
  table.resp td.rh+td.rh{padding-top:0!important}
  table.resp tr td.rh:last-of-type{border-bottom:1px solid var(--line)!important;padding-bottom:8px!important;margin-bottom:4px}
  table.resp td:empty{display:none}
  table.resp tfoot tr{background:var(--surface-2)}
  .panel table.resp tr{box-shadow:none;background:var(--surface-2);border-color:transparent}

.mono.long{font-size:10.5px;letter-spacing:0}

</style>

<body>
<div class="shell">
  <aside class="side" aria-label="Fő navigáció">
    <div class="logo"><div class="logo-mark"><span></span></div><div><b>Határidős ügyletek</b><small>Deviza napló</small></div></div>
    <nav class="nav" id="nav"></nav>
    <div class="side-foot">Az adatok a saját, privát tárhelyeden vannak.</div>
  </aside>
  <main class="main">
    <div class="ticker" id="ticker" hidden aria-label="Árfolyamok"></div>
    <header class="top">
      <h1 id="topTitle">Betöltés</h1>
      <div class="top-actions">
        <button class="btn hide-m" data-act="eval-year">Év kiértékelése</button>
        <button class="btn hide-m" data-act="eval-month">Havi kiértékelés</button>
        <button class="btn primary" id="newBtn" data-act="menu" aria-haspopup="true" aria-expanded="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>Új</button>
        <div class="menu" id="newMenu" role="menu">
          <button role="menuitem" data-act="new-trade">Új ügylet</button>
          <button role="menuitem" data-act="new-other">Egyéb tétel (díj, korrekció)</button>
          <button role="menuitem" data-act="new-deposit">Új lekötés vagy fedezet</button>
          <button role="menuitem" data-act="new-account">Új bankszámla</button>

/* ---------- local (on-device) store with the same API as the claude.ai db */
function makeLocalDb() {
  const KEY = 'hatarido-db-v1';
  let store = {};
  try { store = JSON.parse(localStorage.getItem(KEY) || '{}') || {}; } catch (e) { store = {}; }
  const subs = new Set();
  let saveT = null;
  const flush = () => { saveT = null; try { localStorage.setItem(KEY, JSON.stringify(store)); } catch (e) { toast('A tárhely megtelt vagy nem elérhető, a változás nem mentődött el.', true); } };
  const save = () => { if (!saveT) saveT = setTimeout(flush, 0); };
  window.addEventListener('pagehide', () => { if (saveT) { clearTimeout(saveT); flush(); } });
  let nT = null;
  const notify = () => { if (!nT) nT = setTimeout(() => { nT = null; subs.forEach(f => f()); }, 0); };
  window.addEventListener('storage', e => { if (e.key === KEY) { try { store = JSON.parse(e.newValue || '{}') || {}; } catch (x) {} notify(); } });
  const has = p => Object.prototype.hasOwnProperty.call(store, p);
  const snapDoc = p => ({id: p.split('/').pop(), exists: has(p), data: () => store[p], metadata: {fromCache: false, hasPendingWrites: false}});
  const snapColl = c => { const pre = c + '/'; const docs = Object.keys(store).filter(p => p.startsWith(pre) && p.indexOf('/', pre.length) < 0).sort().map(snapDoc); return {docs, size: docs.length, empty: !docs.length, docChanges: () => [], metadata: {}}; };
  const docRef = p => ({
    id: p.split('/').pop(), path: p,
    get: async () => snapDoc(p),
    set: async d => { store[p] = JSON.parse(JSON.stringify(d)); save(); notify(); },
    update: async d => { if (!has(p)) throw {code: 'invalid_argument', message: 'nincs ilyen dokumentum'}; store[p] = Object.assign({}, store[p], JSON.parse(JSON.stringify(d))); save(); notify(); },
    delete: async () => { delete store[p]; save(); notify(); },
    onSnapshot: n => { const f = () => n(snapDoc(p)); subs.add(f); setTimeout(f, 0); return () => subs.delete(f); },
    collection: sub => collRef(p + '/' + sub)
  });
  const collRef = c => {
    const q = {path: c, limit: () => q, where: () => q, orderBy: () => q, get: async () => snapColl(c),
      doc: id => docRef(c + '/' + (id || uid6())),
      add: async d => { const r = docRef(c + '/' + uid6()); await r.set(d); return r; },
      onSnapshot: n => { const f = () => n(snapColl(c)); subs.add(f); setTimeout(f, 0); return () => subs.delete(f); }};
    return q;
  };
  return {doc: docRef, collection: collRef};
}
const localDownloads = {
  async save(o) {
    const type = /\.json$/.test(o.filename) ? 'application/json' : /\.csv$/.test(o.filename) ? 'text/csv' : 'application/octet-stream';
    const blob = new Blob([o.data], {type});
    const touch = matchMedia('(pointer: coarse)').matches;
    if (touch && navigator.canShare && typeof File !== 'undefined') {
      const file = new File([blob], o.filename, {type});
      if (navigator.canShare({files: [file]})) {
        try { await navigator.share({files: [file], title: o.filename}); return {status: 'saved'}; }
        catch (e) { if (e && e.name === 'AbortError') throw {code: 'declined'}; }
      }
    }
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a'); a.href = url; a.download = o.filename; document.body.appendChild(a); a.click();
    setTimeout(() => { URL.revokeObjectURL(url); a.remove(); }, 1500);
    return {status: 'saved'};
  }
};

async function withRetry(fn) {

function dueItems() {
  const t0 = TODAY(), items = [], settle = {};
  S.trades.forEach(t => {
    if (t.status === 'nyitott' && t.fwdDate) items.push({date: t.fwdDate, type: 'open', bankId: t.bankId, ref: t, amount: isNum(t.pnl) ? t.pnl : null});
    else if (t.status === 'fuggo' && t.fwdDate) items.push({date: t.fwdDate, type: 'order', bankId: t.bankId, ref: t, amount: null});
    else if (t.status === 'zart' && t.fwdDate && t.fwdDate >= t0 && isNum(t.pnl)) {
      const k = t.bankId + '|' + t.fwdDate;
      (settle[k] = settle[k] || {date: t.fwdDate, type: 'settle', bankId: t.bankId, list: [], amount: 0});
      settle[k].list.push(t); settle[k].amount += t.pnl;
    }

  Object.values(settle).forEach(x => items.push(x));
  S.deposits.forEach(d => {
    if (d.maturityDate && d.maturityDate >= t0) items.push({date: d.maturityDate, type: 'maturity', bankId: d.bankId, ref: d, amount: d.maturityValue});
    if (d.startDate && d.startDate > t0) items.push({date: d.startDate, type: 'start', bankId: d.bankId, ref: d, amount: d.invested});
    (d.payoutDates || []).forEach(md => { if (/^\d{2}-\d{2}$/.test(md)) items.push({date: nextPayout(md, t0), type: 'payout', bankId: d.bankId, ref: d, amount: null}); });

function rawRate(pair) { const r = S.market.rates[pair]; return r && isNum(r.v) ? r : null; }
function toHUF(cur, depth) {
  depth = depth || 0;
  if (!cur) return null;
  if (cur === 'HUF') return 1;
  let r = rawRate(cur + '/HUF'); if (r) return r.v;
  r = rawRate('HUF/' + cur); if (r && r.v) return 1 / r.v;
  if (depth > 1) return null;
  for (const via of ['USD', 'EUR']) {
    if (via === cur) continue;
    const vh = toHUF(via, depth + 1); if (!vh) continue;
    r = rawRate(cur + '/' + via); if (r) return r.v * vh;
    r = rawRate(via + '/' + cur); if (r && r.v) return vh / r.v;
  }
  return null;
}
function rateInfo(pair) {
  if (!pair || pair.indexOf('/') < 0) return null;
  const d = rawRate(pair);
  if (d) return {v: d.v, t: d.t, src: d.src, derived: false};
  const inv = rawRate(quoteCur(pair) + '/' + baseCur(pair));
  if (inv && inv.v) return {v: 1 / inv.v, t: inv.t, src: 'fordított: ' + inv.src, derived: true};
  const a = toHUF(baseCur(pair)), b = toHUF(quoteCur(pair));
  if (a && b) return {v: a / b, t: S.market.updatedAt, src: 'keresztárfolyam a forintos árakból', derived: true};
  return null;
}
function prevRate(pair) {
  const hs = S.market.history || [];

  return null;
}
function pairHistory(pair) { return (S.market.history || []).filter(x => x.r && isNum(x.r[pair])).map(x => ({t: x.t, v: x.r[pair]})); }
/* mark-to-market of an open forward, using the Excel logic: eladás = (határidős ár − piaci) × mennyiség × 1 000 000 × deviza→Ft */
function mtm(t) {
  if (t.status !== 'nyitott' || t.kind === 'opcio' || t.kind === 'egyeb') return null;
  if (!t.side || !isNum(t.qty)) return null;
  const ref = isNum(t.fwdPrice) ? t.fwdPrice : (isNum(t.openRate) ? t.openRate : null);
  const ri = rateInfo(t.pair); const qh = toHUF(quoteCur(t.pair));
  if (ref == null || !ri || !qh) return null;
  const diff = t.side === 'eladas' ? ref - ri.v : ri.v - ref;
  return {pnl: Math.round(diff * t.qty * 1e6 * qh * 100) / 100, cur: ri.v, ref, diff, qh, derived: ri.derived};
}
function optionRange(t) {
  const s = typeof t.openRate === 'string' ? t.openRate : '';
  const m = s.replace(/\s/g, '').match(/^(\d+(?:[.,]\d+)?)-(\d+(?:[.,]\d+)?)$/);
  if (!m) return null;
  return [parseFloat(m[1].replace(',', '.')), parseFloat(m[2].replace(',', '.'))];
}
function mtmTotal(list) {

  list.forEach(t => { if (t.status !== 'nyitott' || t.kind !== 'hatarido') return; const m = mtm(t); if (m) { sum += m.pnl; n++; } else missing++; });
  return {sum, n, missing};
}

function monthTable(bankIds) {
  const list = realizedDated(t => bankIds.includes(t.bankId));

  if (!keys.length) return '<div class="empty">Nincs adat.</div>';

  return '<div style="max-height:320px;overflow:auto"><table class="tbl compact"><thead><tr><th>Hónap</th><th class="num">Ügylet</th><th class="num">Eredmény</th></tr></thead><tbody>' + keys.map(k => '<tr data-eval-month="' + k + '"><td>' + monthLabel(k, true) + '</td><td class="num">' + (cnt[k] || 0) + '</td><td class="num ' + signCls(ms[k]) + '">' + fmtFt(ms[k] || 0, {sign: true}) + '</td></tr>').join('') + '</tbody></table></div>';
}
function sortTrades(list) {
  const f = UI.tf, dir = f.dir === 'asc' ? 1 : -1;
  const pr = {nyitott: 0, fuggo: 1, zart: 2};
  const dk = t => t.openDate || t.fwdDate || t.closeDate || '';
  const key = {
    open: t => dk(t), fwd: t => t.fwdDate || '', close: t => t.closeDate || '', pnl: t => isNum(t.pnl) ? t.pnl : -Infinity,
    pair: t => t.pair || '', status: t => pr[t.status]
  }[f.sort] || dk;
  return list.slice().sort((a, b) => {
    if (f.sort === 'open') { const p = (pr[a.status] || 0) - (pr[b.status] || 0); if (p) return p; }
    const x = key(a), y = key(b);
    if (x < y) return -1 * dir; if (x > y) return 1 * dir;
    return (a.id < b.id ? -1 : 1) * dir;
  });
}
function filteredTrades(bankId) {
  const f = UI.tf, q = f.q.trim().toLowerCase();
  return tradesOf(bankId).filter(t => {
    if (f.status !== 'all' && t.status !== f.status) return false;
    if (f.pair !== 'all' && t.pair !== f.pair) return false;
    if (f.year !== 'all' && (t.openDate || t.fwdDate || t.closeDate || '').slice(0, 4) !== f.year) return false;
    if (q) {
      const hay = [t.pair, t.label, t.note, sideLabel(t), kindLabel(t), statusLabel(t.status), t.openRate, t.closeRate, t.fwdPrice, t.orderPrice, t.pnl, t.openDate, t.closeDate, t.fwdDate].join(' ').toLowerCase();
      if (!hay.includes(q)) return false;
    }
    return true;
  });
}

      '<td>' + two(fmtDate(t.openDate), fmtRate(t.openRate)) + '</td>' +

    '<p class="legend-note">Sárga sor: nyitott pozíció. Kék sor: még nem teljesült order. A * jelölt irányt az Excel képletéből következtettem ki, mert az Excelben nem volt megadva.</p>';
}
function pnlCell(t) {

  if (t.status === 'fuggo' && t.orderPrice != null) { const ri = rateInfo(t.pair); if (ri && isNum(t.orderPrice)) return '<span class="mut">order ' + nf2.format((t.orderPrice - ri.v) / ri.v * 100) + '%-ra</span>'; }

}

  const allTr = S.trades.filter(t => t.status !== 'zart' || inYear(t));
  const statsC = cols.map(c => statsFor(c.tr)), statsT = statsFor(allTr);
  const depC = cols.map(c => depSummary(c.deps)), depT = depSummary(S.deposits);
  const pdep = y === 'all' ? null : periodStats(y + '-01-01', y + '-12-31');
  const rowsDef = [

/* ---------- due */
function dueRow(i) {

  const dd2 = parseISO(i.date);

    const m = mtm(t);

    action = '<button class="btn sm" data-close-trade="' + h(t.id) + '">' + ic('check') + 'Zárás rögzítése</button>';
  } else if (i.type === 'order') {
    const t = i.ref;
    title = 'Order: ' + (sideLabel(t) || '') + ' ' + (t.pair || '') + (t.orderPrice != null ? ' @ ' + fmtRate(t.orderPrice) : '');
    desc = 'Függő order érvényessége lejár. Névérték: ' + notionalText(t);
    action = '<button class="btn sm" data-edit-trade="' + h(t.id) + '">' + ic('edit') + 'Megnyitás</button>';
  } else if (i.type === 'settle') {
    title = 'Elszámolás: ' + i.list.length + ' lezárt ügylet';
    desc = 'A határidős dátumon esedékes pénzügyi teljesítés';
    amount = '<span class="' + signCls(i.amount) + '">' + fmtFt(i.amount, {sign: true}) + '</span>';
    action = '<details class="more"><summary>Tételek</summary><ul>' + i.list.map(t => '<li>' + h((sideLabel(t) + ' ' + (t.pair || '')).trim()) + ': ' + fmtFt(t.pnl, {sign: true}) + '</li>').join('') + '</ul></details>';
  } else if (i.type === 'maturity') {
    const d = i.ref, y = depYield(d);
    title = depTitle(d) + ' lejár';
    desc = 'Bekerülés: ' + fmtMoney(d.invested, d.currency) + (isNum(y) ? ', hozam: ' + fmtMoney(y, d.currency, {sign: true}) : '') + (isNum(d.rate) ? ', ' + nfPct.format(d.rate * 100) + '%' : '');
    amount = fmtMoney(d.maturityValue, d.currency);
    action = '<button class="btn sm" data-edit-dep="' + h(d.id) + '">' + ic('edit') + 'Megnyitás</button>';
  } else if (i.type === 'start') {
    const d = i.ref;
    title = 'Új ' + (d.instrument || 'lekötés') + ' indul';
    desc = 'Lejárat: ' + fmtDate(d.maturityDate) + (isNum(d.rate) ? ', ' + nfPct.format(d.rate * 100) + '%' : '');
    amount = fmtMoney(d.invested, d.currency);
    action = '<button class="btn sm" data-edit-dep="' + h(d.id) + '">' + ic('edit') + 'Megnyitás</button>';
  } else if (i.type === 'payout') {
    const d = i.ref;
    title = 'Kamatkifizetés: ' + depTitle(d);
    desc = 'Ismétlődő kifizetési nap' + (isNum(d.monthlyOverride) ? ', havi hozam: ' + fmtFt(d.monthlyOverride) : '');
    action = '<button class="btn sm" data-edit-dep="' + h(d.id) + '">' + ic('edit') + 'Megnyitás</button>';
  }
  const dl = dd < 0 ? Math.abs(dd) + ' napja lejárt' : dd === 0 ? 'ma' : dd === 1 ? 'holnap' : dd + ' nap múlva';
  return '<div class="due-item" style="--bc:' + h(b.color) + '"><div class="due-date"><small>' + HU_MON_SHORT[dd2.getMonth()] + '</small><b>' + dd2.getDate() + '</b><small>' + dd2.getFullYear() + '</small></div>' +
    '<div class="due-main"><div class="t">' + h(title) + '</div><div class="d"><span class="chip bank" style="background:' + h(b.color) + '">' + h(b.short || b.name) + '</span> ' + h(desc) + '</div></div>' +
    '<div class="due-right"><span class="due-days ' + (dd < 0 ? 'late' : dd <= 7 ? 'soon' : '') + '">' + dl + '</span>' + (amount ? '<span class="a">' + amount + '</span>' : '') + action + '</div></div>';
}
function viewDue() {
  const t0 = TODAY(), all = dueItems().filter(i => UI.dueBank === 'all' || i.bankId === UI.dueBank);
  const groups = [
    ['Lejárt, de még nyitott', i => i.date < t0],
    ['Ma', i => i.date === t0],
    ['A következő 7 napban', i => i.date > t0 && i.date <= addDays(t0, 7)],
    ['A következő 30 napban', i => i.date > addDays(t0, 7) && i.date <= addDays(t0, 30)],
    ['Később', i => i.date > addDays(t0, 30)]
  ];
  const noDate = S.trades.filter(t => (t.status === 'fuggo' || t.status === 'nyitott') && !t.fwdDate && (UI.dueBank === 'all' || t.bankId === UI.dueBank));
  let html = '<div class="filters"><div class="chips"><button class="pill-btn" data-due-bank="all" aria-pressed="' + (UI.dueBank === 'all') + '">Minden bank</button>' + banksSorted().map(b => '<button class="pill-btn" data-due-bank="' + h(b.id) + '" aria-pressed="' + (UI.dueBank === b.id) + '">' + h(b.name) + '</button>').join('') + '</div></div>';
  const in30 = all.filter(i => i.date >= t0 && i.date <= addDays(t0, 30));
  const settle30 = in30.filter(i => i.type === 'settle').reduce((a, i) => a + i.amount, 0);
  const mat30 = in30.filter(i => i.type === 'maturity' && (i.ref.currency || 'HUF') === 'HUF').reduce((a, i) => a + (i.amount || 0), 0);
  html += '<div class="grid g4" style="margin-bottom:18px"><div class="stat"><div class="l">Lejárt, még nyitott</div><div class="v ' + (all.some(i => i.date < t0) ? 'neg' : '') + '">' + all.filter(i => i.date < t0).length + ' tétel</div></div><div class="stat"><div class="l">30 napon belül</div><div class="v">' + in30.length + ' tétel</div></div><div class="stat"><div class="l">Elszámolás 30 napon belül</div><div class="v ' + signCls(settle30) + '">' + fmtFt(settle30, {sign: true}) + '</div></div><div class="stat"><div class="l">Lejáró lekötések 30 napon belül</div><div class="v">' + fmtCompact(mat30) + ' Ft</div></div></div>';
  let any = false;
  groups.forEach(g => {
    const items = all.filter(g[1]); if (!items.length) return; any = true;
    const s = items.filter(i => i.type === 'settle').reduce((a, i) => a + i.amount, 0);
    html += '<section class="due-group"><h3>' + g[0] + ' <span class="chip soft">' + items.length + '</span>' + (s ? '<span class="sum ' + signCls(s) + '">Elszámolás: ' + fmtFt(s, {sign: true}) + '</span>' : '') + '</h3>' + items.map(dueRow).join('') + '</section>';
  });
  if (noDate.length) {
    any = true;
    html += '<section class="due-group"><h3>Határidő nélküli nyitott tételek <span class="chip soft">' + noDate.length + '</span></h3><div class="tbl-wrap rwrap"><table class="tbl compact resp"><thead><tr><th>Bank</th><th>Állapot</th><th>Irány</th><th>Devizapár</th><th class="num">Mennyiség</th><th class="num">Order</th></tr></thead><tbody>' + noDate.map(t => '<tr data-edit-trade="' + h(t.id) + '"><td><span class="chip bank" style="background:' + h(bankColor(t.bankId)) + '">' + h(bankById(t.bankId).short) + '</span></td><td>' + statusLabel(t.status) + '</td><td>' + (sideLabel(t) || '—') + '</td><td>' + h(t.pair) + '</td><td class="num">' + fmtQty(t.qty) + '</td><td class="num">' + fmtRate(t.orderPrice) + '</td></tr>').join('') + '</tbody></table></div></section>';
  }
  if (!any) html += '<div class="panel empty"><b>Nincs esedékes tétel</b>A nyitott pozíciók határideje, a lezárt ügyletek elszámolása és a lekötések lejárata itt jelenik meg.</div>';
  return {title: 'Esedékes', sub: 'Minden, ami dátumhoz kötött: határidők, elszámolások, lejáratok', html};
}

/* ---------- ticker strip */
function renderTicker() {
  const el = $('#ticker'); if (!el) return;
  const pairs = (S.local ? Array.from(new Set(['EUR/HUF', 'USD/HUF', 'CHF/HUF', 'GBP/HUF', 'PLN/HUF', 'EUR/USD', 'GBP/USD', 'USD/CHF', 'USD/JPY'].concat(S.trades.filter(t => t.status === 'nyitott').map(t => t.pair).filter(Boolean)))) : Array.from(new Set(WATCH.concat(Object.keys(S.market.rates || {}))))).filter(p => rateInfo(p));
  if (!pairs.length) { el.innerHTML = ''; el.hidden = true; return; }
  el.hidden = false;
  const age = ratesAge();
  let lab;
  if (S.local) { const d = S.market.updatedAt ? new Date(S.market.updatedAt) : null; lab = Live.err ? 'Nincs frissítés' : d ? '<i class="live-dot"></i>Élő ' + pad(d.getHours()) + ':' + pad(d.getMinutes()) : 'Betöltés…'; }
  else lab = age == null ? '' : age < 1 ? 'most frissítve' : age < 24 ? nf0.format(age) + ' órája' : nf0.format(age / 24) + ' napja';

    }).join('');
}

    '</div><div class="more-sec"><h3>Bankok</h3>' + banksSorted().map(b => '<button class="more-row" data-bank="' + h(b.id) + '"><span class="mr-ic" style="background:' + h(b.color) + ';color:#fff;font:800 11px var(--f-display)">' + h((b.short || b.name).slice(0, 5)) + '</span><span class="mr-t"><b>' + h(b.name) + '</b><small>' + fmtFt(statsFor(tradesOf(b.id)).sum, {sign: true}) + '</small></span><span class="mr-ch" aria-hidden="true">›</span></button>').join('') +
    row('data-act="new-bank"', 'plus', 'Bank hozzáadása', '') +
    '</div><div class="more-sec"><h3>Gyors műveletek</h3>' +
    row('data-act="new-trade"', 'trade', 'Új ügylet', '') +
    row('data-act="new-other"', 'coin', 'Egyéb tétel', 'Díj, korrekció, jóváírás') +
    row('data-act="new-deposit"', 'wallet', 'Új lekötés vagy fedezet', 'DKJ, betét, kötvény') +
    row('data-act="new-account"', 'bank', 'Új bankszámla', '') +
    row('data-act="edit-rates"', 'refresh', 'Árfolyamok frissítése', 'Utoljára: ' + fmtStamp(S.market.updatedAt)) +
    row('data-act="eval-year"', 'eval', 'Év kiértékelése', '') +
    row('data-act="eval-month"', 'cal', 'Havi kiértékelés', '') +
    row('data-act="export-json"', 'download', 'Mentés letöltése', 'Minden adat egy fájlban') + '</div>';
  return {title: 'Több', sub: 'Minden funkció egy helyen', html};
}

/* ---------- market & live positions */
function viewMarket() {
  const pairsUsed = Array.from(new Set(S.trades.filter(t => t.status !== 'zart').map(t => t.pair).filter(Boolean)));
  const pairs = Array.from(new Set(WATCH.concat(pairsUsed, Object.keys(S.market.rates || {}))));
  const age = ratesAge();
  const open = S.trades.filter(t => t.status === 'nyitott' && t.kind === 'hatarido');
  const opts = S.trades.filter(t => t.status === 'nyitott' && t.kind === 'opcio');
  const pend = S.trades.filter(t => t.status === 'fuggo');
  const tot = mtmTotal(S.trades);
  let html = '';
  if (S.local) { if (Live.err) html += '<div class="banner warn">' + h(Live.err) + ' A legutóbbi letöltött árfolyamokat látod (' + fmtStamp(S.market.updatedAt) + ').</div>'; }
  else if (!Object.keys(S.market.rates || {}).length) html += '<div class="banner warn">Még nincs árfolyam rögzítve. Add meg a mai árfolyamokat, és minden nyitott pozíció piaci áron is megjelenik.</div>';
  else if (age != null && age > 24) html += '<div class="banner warn">Az árfolyamok ' + nf0.format(age / 24) + ' napja frissültek utoljára (' + fmtStamp(S.market.updatedAt) + '). A becsült eredmények ehhez képest pontatlanok lehetnek.</div>';
  html += '<div class="filters"><div>' + (S.local ? '<i class="live-dot"></i><b>Élő árfolyamok</b>, percenként frissül. Utoljára: ' : '<b>Utolsó frissítés:</b> ') + fmtStamp(S.market.updatedAt) + (S.market.source ? ' <span class="mut">(' + h(S.market.source) + ')</span>' : '') + '</div><span class="spacer"></span><button class="btn primary" data-act="edit-rates">' + ic('refresh') + (S.local ? 'Frissítés most' : 'Árfolyamok frissítése') + '</button></div>';
  const quoteTile = p => {
    const r = rateInfo(p), pv = prevRate(p);
    const exp = S.trades.filter(t => t.pair === p && t.status === 'nyitott');
    const net = exp.filter(t => t.kind === 'hatarido').reduce((a, t) => a + (t.side === 'vetel' ? 1 : t.side === 'eladas' ? -1 : 0) * (t.qty || 0), 0);
    const pm = mtmTotal(exp);
    if (!r) return '<div class="quote"><div class="qp">' + h(p) + '</div><div class="qv mut">—</div><div class="qm">Nincs árfolyam megadva</div><button class="btn sm" data-act="edit-rates" style="align-self:flex-start">Megadom</button></div>';
    const ch = pv && !r.derived ? r.v - pv : null, chp = ch != null ? ch / pv * 100 : null;
    return '<div class="quote"><div class="qp"><span>' + h(p) + '</span>' + (r.derived ? '<span class="chip soft" title="' + h(r.src) + '">számított</span>' : '') + '</div>' +
      '<div class="qv">' + fmtRate(roundRate(r.v)) + '</div>' +
      (ch != null ? '<div class="qc ' + (ch > 0 ? 'pos' : ch < 0 ? 'neg' : 'mut') + '">' + (ch > 0 ? '▲ +' : ch < 0 ? '▼ −' : '') + fmtRate(Math.abs(roundRate(ch, r.v))) + ' (' + nf2.format(Math.abs(chp)) + '%)</div>' : '<div class="qc mut">&nbsp;</div>') +
      '<div class="spark"><canvas class="spk" data-pair="' + p + '"></canvas></div>' +
      (S.local ? '' : '<div class="qm">' + h(r.derived ? r.src : (r.src || '')) + (r.t && !r.derived ? ', ' + fmtStamp(r.t) : '') + '</div>') +
      (exp.length ? '<div class="qx">' + exp.length + ' nyitott, nettó ' + (net > 0 ? '+' : net < 0 ? '−' : '') + nf2.format(Math.abs(net)) + ' M' + (pm.n ? ', <b class="' + signCls(pm.sum) + '">' + fmtFt(pm.sum, {sign: true}) + '</b>' : '') + '</div>' : '') +
    '</div>';
  };
  if (S.local) {
    const used = pairsUsed.filter(p => !LIVE_PAIRS.includes(p));
    const groups = [['Nyitott pozícióid devizapárjai', Array.from(new Set(S.trades.filter(t => t.status === 'nyitott').map(t => t.pair).filter(Boolean)))]].concat(LIVE_GROUPS).concat(used.length ? [['Egyéb használt párok', used]] : []);
    html += groups.filter(g => g[1].length).map(g => '<h3 class="q-h">' + h(g[0]) + '</h3><div class="q-grid">' + g[1].map(quoteTile).join('') + '</div>').join('');
  } else html += '<div class="q-grid">' + pairs.map(quoteTile).join('') + '</div>';

  // open positions table
  const byBank = {};
  open.forEach(t => { const m = mtm(t); if (m) byBank[t.bankId] = (byBank[t.bankId] || 0) + m.pnl; });
  html += '<div class="panel section-gap"><div class="panel-head"><div><h2>Nyitott pozíciók piaci áron</h2><p class="sub">Becsült eredmény, ha most zárnád, ugyanazzal a számítással, mint az Excelben</p></div></div>' +
    '<div class="grid g4 stats-m" style="margin-bottom:12px"><div class="stat" style="box-shadow:none;background:var(--surface-2)"><div class="l">Összesen</div><div class="v ' + signCls(tot.sum) + '">' + fmtFt(tot.sum, {sign: true}) + '</div><div class="s">' + tot.n + ' pozíció' + (tot.missing ? ', ' + tot.missing + ' árfolyam nélkül' : '') + '</div></div>' +
    banksSorted().map(b => '<div class="stat" style="box-shadow:none;background:var(--surface-2);border-left:4px solid ' + h(b.color) + '"><div class="l">' + h(b.name) + '</div><div class="v ' + signCls(byBank[b.id] || 0) + '">' + fmtFt(byBank[b.id] || 0, {sign: true}) + '</div></div>').join('') + '</div>';
  if (open.length && isMobile()) {
    html += '<div class="tcards">' + open.slice().sort((a, b) => (a.fwdDate || '').localeCompare(b.fwdDate || '') || a.bankId.localeCompare(b.bankId)).map(t => posCard(t)).join('') + '</div>';
  } else if (open.length) {
    html += '<div class="tbl-wrap" style="box-shadow:none;border:1px solid var(--line)"><table class="tbl"><thead><tr><th>Bank</th><th>Irány</th><th>Devizapár</th><th class="num">Mennyiség</th><th>Nyitás</th><th class="num">Határidős ár</th><th class="num">Piaci ár most</th><th class="num">Eltérés</th><th class="num">Becsült eredmény</th><th class="num">Order</th><th>Határidő</th></tr></thead><tbody>' +
      open.slice().sort((a, b) => (a.fwdDate || '').localeCompare(b.fwdDate || '') || a.bankId.localeCompare(b.bankId)).map(t => {
        const m = mtm(t), ri = rateInfo(t.pair);
        const dist = ri && isNum(t.orderPrice) ? (t.orderPrice - ri.v) / ri.v * 100 : null;
        return '<tr class="r-open" data-edit-trade="' + h(t.id) + '"><td><span class="chip bank" style="background:' + h(bankColor(t.bankId)) + '">' + h(bankById(t.bankId).short) + '</span></td><td><b>' + (sideLabel(t) || '—') + '</b></td><td><b>' + h(t.pair) + '</b></td><td class="num">' + fmtQty(t.qty) + '</td><td>' + fmtDate(t.openDate) + '</td><td class="num">' + (isNum(t.fwdPrice) ? fmtRate(t.fwdPrice) : isNum(t.openRate) ? fmtRate(t.openRate) + '<div class="mut" style="font-size:11px">nyitó árf.</div>' : '—') + '</td>' +
          '<td class="num">' + (ri ? fmtRate(Math.round(ri.v * 1e5) / 1e5) + (ri.derived ? '<div class="mut" style="font-size:11px">számított</div>' : '') : '<span class="mut">nincs árfolyam</span>') + '</td>' +
          '<td class="num ' + (m ? signCls(m.diff) : '') + '">' + (m ? (m.diff > 0 ? '+' : m.diff < 0 ? '−' : '') + nfRate.format(Math.abs(Math.round(m.diff * 1e5) / 1e5)) : '—') + '</td>' +
          '<td class="num pnl ' + (m ? signCls(m.pnl) : '') + '">' + (m ? fmtFt(m.pnl, {sign: true}) : '—') + '</td>' +
          '<td class="num">' + fmtRate(t.orderPrice) + (dist != null ? '<div class="mut" style="font-size:11.5px">' + (dist > 0 ? '+' : '') + nf2.format(dist) + '%</div>' : '') + '</td><td>' + fmtDate(t.fwdDate) + '</td></tr>';
      }).join('') + '</tbody></table></div>';
  } else html += '<div class="empty">Nincs nyitott határidős pozíció.</div>';
  html += '</div>';

  html += '<div class="grid g2 section-gap">';
  html += '<div class="panel"><h2>Nyitott opciók</h2><p class="sub">A mostani árfolyam a sávon belül vagy kívül van</p>' + (opts.length ? '<table class="tbl compact resp"><thead><tr><th>Bank</th><th>Pár</th><th class="num">Menny.</th><th>Sáv</th><th class="num">Most</th><th>Lejárat</th><th class="num">Rögzített</th></tr></thead><tbody>' + opts.map(t => {
    const rg = optionRange(t), ri = rateInfo(t.pair);
    const inside = rg && ri ? ri.v >= rg[0] && ri.v <= rg[1] : null;
    return '<tr data-edit-trade="' + h(t.id) + '"><td><span class="chip bank" style="background:' + h(bankColor(t.bankId)) + '">' + h(bankById(t.bankId).short) + '</span></td><td>' + h(t.pair) + '</td><td class="num">' + fmtQty(t.qty) + '</td><td>' + fmtRate(t.openRate) + '</td><td class="num">' + (ri ? fmtRate(Math.round(ri.v * 100) / 100) : '—') + (inside != null ? ' <span class="chip ' + (inside ? 'st-open' : 'st-order') + '" style="' + (inside ? 'background:var(--profit-soft);color:var(--profit)' : 'background:var(--loss-soft);color:var(--loss)') + '">' + (inside ? 'sávon belül' : 'sávon kívül') + '</span>' : '') + '</td><td>' + fmtDate(t.fwdDate) + (t.fwdDate && t.fwdDate < TODAY() ? ' <span class="chip flag">lejárt</span>' : '') + '</td><td class="num ' + signCls(t.pnl) + '">' + fmtFt(t.pnl, {sign: true}) + '</td></tr>';
  }).join('') + '</tbody></table>' : '<div class="empty">Nincs nyitott opció.</div>') + '</div>';
  html += '<div class="panel"><h2>Függő orderek</h2><p class="sub">Milyen messze van a piac az order szintjétől</p>' + (pend.length ? '<table class="tbl compact resp"><thead><tr><th>Bank</th><th>Irány</th><th>Pár</th><th class="num">Menny.</th><th class="num">Order</th><th class="num">Most</th><th class="num">Távolság</th></tr></thead><tbody>' + pend.map(t => {
    const ri = rateInfo(t.pair), d = ri && isNum(t.orderPrice) ? (t.orderPrice - ri.v) / ri.v * 100 : null;
    return '<tr class="r-order" data-edit-trade="' + h(t.id) + '"><td><span class="chip bank" style="background:' + h(bankColor(t.bankId)) + '">' + h(bankById(t.bankId).short) + '</span></td><td>' + (sideLabel(t) || '—') + '</td><td>' + h(t.pair) + '</td><td class="num">' + fmtQty(t.qty) + '</td><td class="num">' + fmtRate(t.orderPrice) + '</td><td class="num">' + (ri ? fmtRate(Math.round(ri.v * 1e4) / 1e4) : '—') + '</td><td class="num"><b>' + (d != null ? (d > 0 ? '+' : '') + nf2.format(d) + '%' : '—') + '</b></td></tr>';
  }).join('') + '</tbody></table>' : '<div class="empty">Nincs függő order.</div>') + '</div></div>';

  if (S.local) html += '<p class="legend-note">Élő árfolyam: Coinbase középárfolyam, percenként frissül, amíg az app nyitva van. A napi változás és a kis grafikonok az Európai Központi Bank napi referencia-árfolyamához (Frankfurter) viszonyítanak. Ezek piaci középárfolyamok: a bankod saját vételi és eladási jegyzése ettől kicsit eltérhet.</p>';
  else html += '<p class="legend-note">A publikált oldal biztonsági okokból nem tud magától adatot letölteni az internetről, ezért az árfolyamok az „Árfolyamok frissítése” gombbal vagy a csevegésben Claude-dal frissíthetők. A „számított” árfolyamot a forintos árfolyamokból vezettem le (pl. GBP/USD = GBP/HUF ÷ USD/HUF); ha a bank saját jegyzését írod be, az felülírja.</p>';
  return {title: 'Piac és pozíciók', sub: 'Árfolyamok, nyitott pozíciók piaci áron, orderek', html, mount() {
    $$('canvas.spk').forEach((el, i) => {
      const p = el.dataset.pair, hs = pairHistory(p);
      if (hs.length < 2) { el.parentNode.innerHTML = ''; return; }
      el.id = 'spk-' + i;
      const up = hs[hs.length - 1].v >= hs[0].v;
      mk(el.id, {type: 'line', data: {labels: hs.map(x => fmtStamp(x.t)), datasets: [{data: hs.map(x => x.v), borderColor: up ? css('--profit') : css('--loss'), backgroundColor: hexA(up ? '#0C9A6A' : '#DC3F48', .1), fill: true, borderWidth: 2, pointRadius: 0, tension: .3}]},
        options: {responsive: true, maintainAspectRatio: false, animation: false, events: [], plugins: {legend: {display: false}, tooltip: {enabled: false}}, scales: {x: {display: false}, y: {display: false}}}});
    });
  }};
}

/* ---------- evaluation (year / month) */
function viewEval() {
  const ys = yearsAvailable(), t0 = TODAY();
  if (!UI.evalYear || !ys.includes(UI.evalYear)) UI.evalYear = t0.slice(0, 4);
  if (!UI.evalMonth || UI.evalMonth.slice(0, 4) !== UI.evalYear) UI.evalMonth = UI.evalYear === t0.slice(0, 4) ? t0.slice(0, 7) : UI.evalYear + '-12';
  const mode = UI.evalMode, Y = UI.evalYear, M = UI.evalMonth;
  const from = mode === 'year' ? Y + '-01-01' : M + '-01', to = mode === 'year' ? Y + '-12-31' : lastDayOf(M);
  const ps = periodStats(from, to), bs = banksSorted();
  const st = statsFor(ps.trades);
  const prevFrom = mode === 'year' ? (+Y - 1) + '-01-01' : monthsBetween(addDays(M + '-01', -1).slice(0, 7), addDays(M + '-01', -1).slice(0, 7))[0] + '-01';
  const prevTo = mode === 'year' ? (+Y - 1) + '-12-31' : lastDayOf(prevFrom.slice(0, 7));
  const pp = periodStats(prevFrom, prevTo);
  const label = mode === 'year' ? Y + '. év' : monthLabel(M, true);
  const prevLabel = mode === 'year' ? (+Y - 1) + '. év' : monthLabel(prevFrom.slice(0, 7), true);
  let html = '<div class="filters"><div class="seg" role="group" aria-label="Időszak"><button data-eval-mode="year" aria-pressed="' + (mode === 'year') + '">Év kiértékelése</button><button data-eval-mode="month" aria-pressed="' + (mode === 'month') + '">Havi kiértékelés</button></div>' +
    '<div class="chips">' + ys.map(y => '<button class="pill-btn" data-eval-year="' + y + '" aria-pressed="' + (Y === y) + '">' + y + '</button>').join('') + '</div><span class="spacer"></span>' +
    '<div class="seg" role="group" aria-label="Dátum alapja"><button data-basis="close" aria-pressed="' + (S.settings.dateBasis !== 'fwd') + '" title="Az eredmény a zárás napjához tartozik">Zárás dátuma szerint</button><button data-basis="fwd" aria-pressed="' + (S.settings.dateBasis === 'fwd') + '" title="Az eredmény a pénzügyi elszámolás (határidős dátum) napjához tartozik">Elszámolás szerint</button></div></div>';
  if (mode === 'month') html += '<div class="chips m-scroll" id="month-chips" style="margin:-4px 0 14px">' + monthsBetween(Y + '-01', Y + '-12').map(k => '<button class="pill-btn" data-eval-month="' + k + '" aria-pressed="' + (M === k) + '">' + (isMobile() ? HU_MON_SHORT[+k.slice(5) - 1] : HU_MONTHS[+k.slice(5) - 1]) + '</button>').join('') + '</div>';

  const all = ps.total + ps.depTotal, pall = pp.total + pp.depTotal;
  const diff = all - pall;
  let bestKey = null, bestVal = null, worstKey = null, worstVal = null;
  const unitKeys = mode === 'year' ? monthsBetween(Y + '-01', Y + '-12') : Array.from({length: +lastDayOf(M).slice(8)}, (_, i) => M + '-' + pad(i + 1));
  const unitSum = {}; ps.trades.forEach(t => { const d = attrDate(t); const k = mode === 'year' ? monthKey(d) : d; unitSum[k] = (unitSum[k] || 0) + t.pnl; });
  Object.entries(unitSum).forEach(e => { if (bestVal == null || e[1] > bestVal) { bestVal = e[1]; bestKey = e[0]; } if (worstVal == null || e[1] < worstVal) { worstVal = e[1]; worstKey = e[0]; } });
  html += '<section class="hero"><div>' +
    '<p class="hero-lead">' + h(label) + ': kereskedés és lekötések együtt</p><div class="hero-num ' + signCls(all) + '">' + fmtFt(all, {sign: true}) + '</div>' +
    '<p class="hero-lead">' + prevLabel + ': ' + fmtFt(pall, {sign: true}) + (pall ? ', különbség: <b class="' + signCls(diff) + '">' + fmtFt(diff, {sign: true}) + '</b>' : '') + '</p>' +
    '<div class="hero-side two">' +
      '<div class="mini"><div class="l">Kereskedési eredmény</div><div class="v ' + signCls(ps.total) + '">' + fmtFt(ps.total, {sign: true}) + '</div></div>' +
      '<div class="mini"><div class="l">Lejárt lekötések hozama</div><div class="v">' + fmtFt(ps.depTotal, {sign: true}) + '</div></div>' +
      '<div class="mini"><div class="l">Zárt ügyletek</div><div class="v">' + st.n + ' db' + (st.winRate != null ? ', ' + nf0.format(st.winRate * 100) + '% nyer.' : '') + '</div></div>' +
      '<div class="mini"><div class="l">' + (mode === 'year' ? 'Legjobb hónap' : 'Legjobb nap') + '</div><div class="v">' + (bestKey ? (mode === 'year' ? HU_MONTHS[+bestKey.slice(5) - 1] : fmtDate(bestKey)) + '<small>' + fmtFt(bestVal, {sign: true}) + '</small>' : '—') + '</div></div>' +
    '</div></div><div><h2>' + (mode === 'year' ? 'Hónapról hónapra' : 'Napról napra') + '</h2><p class="sub">Bankonként egymásra rakva, vonal: halmozott összesen</p><div class="chart tall"><canvas id="e-main"></canvas></div></div></section>';

  // per bank table
  html += '<div class="panel section-gap"><h2>Bankonként</h2><p class="sub">' + h(label) + '</p><div class="rwrap"><table class="tbl compact resp" data-head="1" style="min-width:640px"><thead><tr><th>Bank</th><th class="num">Ügylet</th><th class="num">Nyereséges</th><th class="num">Veszteséges</th><th class="num">Arány</th><th class="num">Kereskedés</th><th class="num">Lekötések</th><th class="num">Összesen</th></tr></thead><tbody>' +
    bs.map(b => { const s2 = statsFor(ps.byBank[b.id] || []), dep = ps.dep[b.id] || 0; return '<tr data-bank="' + h(b.id) + '"><td><span class="chip bank" style="background:' + h(b.color) + '">' + h(b.short || b.name) + '</span> ' + h(b.name) + '</td><td class="num">' + s2.n + '</td><td class="num pos">' + s2.wins + '</td><td class="num neg">' + s2.losses + '</td><td class="num">' + (s2.winRate != null ? nf0.format(s2.winRate * 100) + '%' : '—') + '</td><td class="num ' + signCls(s2.sum) + '">' + fmtFt(s2.sum, {sign: true}) + '</td><td class="num">' + (dep ? fmtFt(dep, {sign: true}) : '—') + '</td><td class="num"><b class="' + signCls(s2.sum + dep) + '">' + fmtFt(s2.sum + dep, {sign: true}) + '</b></td></tr>'; }).join('') +
    '</tbody><tfoot><tr><td>Összesen</td><td class="num">' + st.n + '</td><td class="num">' + st.wins + '</td><td class="num">' + st.losses + '</td><td class="num">' + (st.winRate != null ? nf0.format(st.winRate * 100) + '%' : '—') + '</td><td class="num">' + fmtFt(ps.total, {sign: true}) + '</td><td class="num">' + fmtFt(ps.depTotal, {sign: true}) + '</td><td class="num">' + fmtFt(all, {sign: true}) + '</td></tr></tfoot></table></div></div>';

/* ================= vault (AES-GCM, PBKDF2) ================= */
const V = {key: null, salt: null, iter: 310000, entries: [], revealed: {}, lastAct: Date.now(), busy: false};
const toB64 = u8 => { let s = ''; for (let i = 0; i < u8.length; i++) s += String.fromCharCode(u8[i]); return btoa(s); };
const fromB64 = b => { const s = atob(b), u = new Uint8Array(s.length); for (let i = 0; i < s.length; i++) u[i] = s.charCodeAt(i); return u; };
async function deriveKey(pw, salt, iter) {
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey({name: 'PBKDF2', salt, iterations: iter, hash: 'SHA-256'}, base, {name: 'AES-GCM', length: 256}, false, ['encrypt', 'decrypt']);
}
async function sealVault() {
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const ct = new Uint8Array(await crypto.subtle.encrypt({name: 'AES-GCM', iv}, V.key, new TextEncoder().encode(JSON.stringify({entries: V.entries}))));
  return {v: 1, kdf: 'PBKDF2-SHA256', iter: V.iter, salt: toB64(V.salt), iv: toB64(iv), ct: toB64(ct), updatedAt: new Date().toISOString()};
}
async function openVault(doc, key) {
  const pt = await crypto.subtle.decrypt({name: 'AES-GCM', iv: fromB64(doc.iv)}, key, fromB64(doc.ct));
  return (JSON.parse(new TextDecoder().decode(pt)).entries) || [];
}
async function persistVault() {
  const doc = await sealVault();
  S.vaultDoc = doc;
  if (S.mode === 'online') await withRetry(() => DB.doc(BASE + '/vault').set(doc));
  if (S.local) Sync.markDirty();
}
function lockVault(silent) { V.key = null; V.salt = null; V.entries = []; V.revealed = {}; if (!silent && UI.route === 'vault') render(); }
async function onVaultDocChange() {
  if (!V.key) return;
  const d = S.vaultDoc;
  if (!d) { lockVault(true); return; }
  if (d.salt !== toB64(V.salt)) { lockVault(true); return; }
  try { V.entries = await openVault(d, V.key); if (UI.route === 'vault') scheduleRender(); } catch (e) { lockVault(true); }
}
setInterval(() => { if (V.key && Date.now() - V.lastAct > 5 * 60 * 1000) { lockVault(); toast('A jelszótár 5 perc tétlenség után lezárult.'); } }, 20000);
['pointerdown', 'keydown'].forEach(ev => document.addEventListener(ev, () => { V.lastAct = Date.now(); }, true));

  html += '<div style="margin-top:10px"><button class="btn sm ghost" data-act="vault-change">Mesterjelszó módosítása</button></div>';

async function vaultCreate() {
  const a = $('#vm1').value, b = $('#vm2').value;
  if (a.length < 8) return toast('A mesterjelszó legalább 8 karakter legyen.', true);
  if (a !== b) return toast('A két mesterjelszó nem egyezik.', true);
  V.salt = crypto.getRandomValues(new Uint8Array(16));
  V.key = await deriveKey(a, V.salt, V.iter); V.entries = [];
  await persistVault(); toast('Jelszótár létrehozva.'); render();
}
async function vaultUnlock() {
  const pw = $('#vmu').value; const d = S.vaultDoc; if (!pw || !d) return;
  const btn = document.querySelector('[data-act="vault-unlock"]'); if (btn) { btn.disabled = true; btn.textContent = 'Megnyitás…'; }
  try {
    const salt = fromB64(d.salt), key = await deriveKey(pw, salt, d.iter || 310000);
    V.entries = await openVault(d, key); V.key = key; V.salt = salt; V.iter = d.iter || 310000; V.lastAct = Date.now();
    render();
  } catch (e) { toast('Hibás mesterjelszó.', true); if (btn) { btn.disabled = false; btn.innerHTML = ic('lock') + 'Megnyitás'; } }
}
function vaultReveal(id) {
  if (V.revealed[id]) { clearTimeout(V.revealed[id]); delete V.revealed[id]; }
  else V.revealed[id] = setTimeout(() => { delete V.revealed[id]; if (UI.route === 'vault') render(); }, 20000);
  render();
}
async function copyText(txt) {
  try { await navigator.clipboard.writeText(txt); toast('Vágólapra másolva.'); return; } catch (e) {}
  const ta = document.createElement('textarea'); ta.value = txt; ta.style.position = 'fixed'; ta.style.opacity = '0'; document.body.appendChild(ta); ta.select();
  let ok = false; try { ok = document.execCommand('copy'); } catch (e) {}
  ta.remove(); toast(ok ? 'Vágólapra másolva.' : 'A másolást a böngésző nem engedte. Jelenítsd meg, és jelöld ki kézzel.', !ok);
}
function loadScript(src) { return new Promise((res, rej) => { const s = document.createElement('script'); s.src = src; s.onload = res; s.onerror = rej; document.head.appendChild(s); }); }
async function ensureXLSX() {
  if (window.XLSX) return;
  try { await loadScript('https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.mini.min.js'); }
  catch (e) { await loadScript('https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.mini.min.js'); }
}
async function vaultImportXlsx(file) {
  try {
    toast('Excel beolvasása…');
    await ensureXLSX();
    const wb = window.XLSX.read(await file.arrayBuffer(), {type: 'array'});
    const name = wb.SheetNames.find(n => /jelsz/i.test(n));
    if (!name) return toast('Nem találtam „Jelszó” nevű lapot a fájlban.', true);
    const rows = window.XLSX.utils.sheet_to_json(wb.Sheets[name], {header: 1, raw: true, blankrows: false});
    let added = 0;
    rows.forEach((r, i) => {
      const a = r[0], b = r[1]; if (a == null && b == null) return;
      const str = v => v == null ? '' : (typeof v === 'number' && Number.isInteger(v) ? String(v) : String(v));
      const title = str(a) || ('Excel ' + (i + 1) + '. sor'), pw = str(b);
      if (V.entries.some(e => e.title === title && e.password === pw)) return;
      V.entries.push({id: uid6(), title, username: '', password: pw, url: '', note: 'Importálva az Excel „' + name + '” lapjáról (' + (i + 1) + '. sor). Az első oszlop lett a megnevezés, a második a jelszó.', bankId: /otp/i.test(title) ? 'otp' : ''});
      added++;
    });
    if (added) await persistVault();
    toast(added ? added + ' bejegyzés importálva.' : 'Nem volt új bejegyzés.');
    render();
  } catch (e) { console.error(e); toast('Az Excel beolvasása nem sikerült.', true); }
}
